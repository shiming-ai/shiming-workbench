<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="description" content="Crazy Friday · 疯狂星期五 · 总工作台 6.0 · 所有业务/官网/变现一站式管理">
<title>Crazy Friday · 总工作台 6.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1c1c2e;--bg2:#252540;--bg3:#2d2d4a;
  --ink:#ffffff;--ink2:#d8dae8;--ink3:#a0a4b8;--ink4:#6d7088;
  --line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.1);
  --primary:#A855F7;--primary2:#7C3AED;--pink:#EC4899;--pink2:#F472B6;
  --amber:#F59E0B;--red:#EF4444;--green:#10B981;--blue:#3B82F6;--cyan:#22D3EE;
  --red-soft:rgba(239,68,68,.15);--amber-soft:rgba(245,158,11,.15);
  --green-soft:rgba(16,185,129,.15);--blue-soft:rgba(59,130,246,.15);
  --safe-b:env(safe-area-inset-bottom);
  --sidebar-w:260px;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
/* 网格点背景 */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(168,85,247,.25) 1px,transparent 1px);background-size:32px 32px;opacity:.5}
/* 顶部光晕 */
body::after{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:600px;border-radius:50%;background:radial-gradient(ellipse,rgba(168,85,247,.2),transparent 70%);pointer-events:none;z-index:0}
.layout{display:flex;min-height:100vh;position:relative;z-index:1}

/* ===== 左侧导航（深色玻璃） ===== */
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#131024,#0d0a1e);color:var(--ink);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s ease;border-right:1px solid rgba(255,255,255,.12);overflow:hidden;box-shadow:8px 0 30px rgba(0,0,0,.45)}
.sidebar::before{content:'';position:absolute;top:-100px;left:-100px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.18),transparent 70%);pointer-events:none}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.sb-head{padding:20px 18px 16px;display:flex;align-items:center;gap:11px;position:relative;z-index:1;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
.sb-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#A855F7,#EC4899 70%,#F472B6);display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;font-weight:900;font-size:15px;box-shadow:0 8px 24px rgba(168,85,247,.45);flex-shrink:0;position:relative}
.sb-mark::after{content:'';position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:#10B981;box-shadow:0 0 8px rgba(16,185,129,.8);border:2px solid var(--bg)}
.sb-t1{font-family:Georgia,serif;font-size:16px;font-weight:900;letter-spacing:-.4px;color:#fff;background:linear-gradient(135deg,#fff,#C084FC);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb-t2{font-size:9px;color:var(--ink3);margin-top:2px;letter-spacing:.5px}
.sb-close{display:none;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid var(--line2);cursor:pointer;align-items:center;justify-content:center;color:var(--ink2);flex-shrink:0;margin-left:auto}
.sb-close:active{transform:scale(.9)}
.sb-close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.sb-body{flex:1;overflow-y:auto;padding:12px 0;position:relative;z-index:1}
.sb-sec{margin-bottom:6px}
.sb-sec-t{padding:10px 18px 5px;font-size:9.5px;font-weight:900;color:#6a7390;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.sb-sec-t::before{content:'';width:3px;height:10px;background:linear-gradient(180deg,#A855F7,#EC4899);border-radius:2px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:#cdd4e3;font-size:12.5px;font-weight:600;border-radius:10px;margin:0 8px;transition:all .15s;position:relative}
.sb-item:hover{background:rgba(255,255,255,.04);color:#fff}
.sb-item.on{background:linear-gradient(90deg,rgba(168,85,247,.18),rgba(236,72,153,.06));color:#fff;box-shadow:inset 2px 0 0 #A855F7}
.sb-item.on::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:linear-gradient(180deg,#A855F7,#EC4899);border-radius:0 3px 3px 0;box-shadow:0 0 8px rgba(168,85,247,.6)}
.sb-item .ico{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.sb-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .badge{margin-left:auto;font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:rgba(168,85,247,.3);color:#d8b4fe;flex-shrink:0;border:1px solid rgba(168,85,247,.4)}
.sb-subitem{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 42px;cursor:pointer;color:#9aa3b8;font-size:11.5px;font-weight:600;border-radius:8px;margin:0 12px;transition:all .15s}
.sb-subitem:hover{background:rgba(255,255,255,.04);color:#fff}
.sb-subitem.on{background:rgba(168,85,247,.1);color:#fff}
.sb-subitem .ico{font-size:12px;width:14px}
.sb-foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.1);position:relative;z-index:1;background:rgba(255,255,255,.02)}
.sb-status{display:flex;align-items:center;gap:6px;font-size:9.5px;color:#8b93aa;line-height:1.5}
.sb-status .dot{width:6px;height:6px;border-radius:50%;background:#10B981;box-shadow:0 0 6px rgba(16,185,129,.8);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.sb-ver{font-family:ui-monospace,Menlo,monospace;color:#5a6178;font-size:9px;margin-top:6px}

/* ===== 右侧主区 ===== */
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
.topbar{height:64px;background:rgba(28,28,46,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.15);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50}
.topbar .menu-btn{display:none;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line2);cursor:pointer;align-items:center;justify-content:center;color:var(--ink)}
.topbar .menu-btn:active{transform:scale(.95)}
.topbar .crumb{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.topbar .crumb .b-now{font-size:13.5px;font-weight:800;color:var(--ink)}
.topbar .crumb .b-sep{opacity:.4;color:var(--ink4)}
.topbar .crumb .b-prev{color:var(--ink2)}
.topbar .actions{display:flex;gap:6px}
.icon-btn2{height:36px;padding:0 12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:10px;color:var(--ink2);font-size:11.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.icon-btn2:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.15)}
.icon-btn2:active{transform:scale(.95)}
.icon-btn2 svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.content{flex:1;background:transparent;position:relative;overflow:auto}
.iframe-wrap{width:100%;height:100%;min-height:calc(100vh - 64px);position:relative}
#contentFrame{width:100%;height:100%;border:none;background:#fff;display:block}

/* ===== 总览（深色玻璃旗舰版 6.0） ===== */
.overview{padding:24px 24px 40px;max-width:1280px;margin:0 auto;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Hero 玻璃卡 */
.ov-hero{position:relative;border-radius:24px;padding:28px 28px;background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(236,72,153,.08));border:1px solid rgba(168,85,247,.25);overflow:hidden;margin-bottom:20px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ov-hero::before{content:'';position:absolute;top:-80px;right:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.25),transparent 70%);pointer-events:none}
.ov-hero::after{content:'';position:absolute;bottom:-60px;left:30%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.2),transparent 70%);pointer-events:none}
.ov-hero-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1;margin-bottom:14px}
.ov-hero-logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#A855F7,#EC4899);display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;font-weight:900;font-size:18px;box-shadow:0 8px 24px rgba(168,85,247,.4)}
.ov-hero-meta{display:flex;flex-direction:column}
.ov-hero-b{font-size:10px;font-weight:800;color:#C084FC;letter-spacing:1.5px;text-transform:uppercase}
.ov-hero-t{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-top:4px;color:#fff}
.ov-hero-sub{font-size:12px;color:var(--ink2);position:relative;z-index:1;max-width:560px;line-height:1.7;margin-bottom:18px}
.ov-hero-stats{display:flex;gap:10px;position:relative;z-index:1;flex-wrap:wrap}
.ov-hero-tag{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:6px 14px;font-size:11px;font-weight:700;color:var(--ink2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ov-hero-tag .v{font-size:14px;font-weight:900;color:#fff}
.ov-hero-tag.up .v{color:#34D399}
.ov-hero-tag.warn .v{color:#FCD34D}
.ov-hero-tag .dot{width:5px;height:5px;border-radius:50%;background:#10B981;box-shadow:0 0 4px rgba(16,185,129,.8);animation:pulse 2s infinite}

/* KPI 4 卡 */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.kpi-card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid var(--line2);border-radius:20px;padding:18px;transition:all .25s;overflow:hidden;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.kpi-card:hover{transform:translateY(-3px);border-color:rgba(168,85,247,.4);box-shadow:0 20px 50px rgba(168,85,247,.15)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
.kpi-card .kpi-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.kpi-card .kpi-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.kpi-card .kpi-ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi-card .kpi-tag{font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:1px;text-transform:uppercase}
.kpi-card .kpi-n{font-size:34px;font-weight:900;line-height:1;letter-spacing:-1.5px;background:linear-gradient(180deg,#fff,#a89ec9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.kpi-card .kpi-trend{display:flex;align-items:flex-end;gap:4px;height:36px;margin-top:8px}
.kpi-card .kpi-trend svg{flex:1;height:100%;width:100%}
.kpi-card .kpi-foot{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:10px;color:var(--ink3)}
.kpi-card .kpi-foot .ch{color:#34D399;font-weight:700}
.kpi-card .kpi-foot .ch.dn{color:#F87171}
.kpi-card .kpi-foot .ch.flat{color:var(--ink3)}

/* 双栏 */
.dual-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:20px}
.glass-card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line2);border-radius:20px;padding:18px 20px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:border-color .2s}
.glass-card:hover{border-color:rgba(255,255,255,.18)}
.glass-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent)}
.gc-hd{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.gc-hd .gc-t{font-size:13.5px;font-weight:900;letter-spacing:-.3px}
.gc-hd .gc-s{font-size:10px;color:var(--ink3);margin-left:auto;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.05)}
.gc-hd .gc-ic{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#A855F7,#EC4899)}
.gc-hd .gc-ic svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.4}

/* 业务产品卡列表 */
.biz-list{display:flex;flex-direction:column;gap:9px}
.biz-card{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:all .15s}
.biz-card:hover{background:rgba(255,255,255,.05);border-color:rgba(168,85,247,.3);transform:translateX(2px)}
.biz-card .bc-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.biz-card .bc-t{font-size:12.5px;font-weight:800;line-height:1.2}
.biz-card .bc-d{font-size:9.5px;color:var(--ink3);margin-top:2px}
.biz-card .bc-bar{flex:1;min-width:0;margin-left:6px}
.biz-card .bc-bar-bg{height:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:6px}
.biz-card .bc-bar-i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#A855F7,#EC4899)}
.biz-card .bc-meta{font-size:10px;color:var(--ink3);font-weight:700;margin-top:4px;display:flex;justify-content:space-between}
.biz-card .bc-status{font-size:9px;font-weight:800;padding:2px 7px;border-radius:99px;background:rgba(16,185,129,.15);color:#34D399;flex-shrink:0}
.biz-card .bc-status.full{background:rgba(245,158,11,.15);color:#FCD34D}

/* 即将到期 */
.exp-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto}
.exp-list::-webkit-scrollbar{width:4px}
.exp-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.exp-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06)}
.exp-item.urgent{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.25)}
.exp-item.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.2)}
.exp-item .e-ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:rgba(255,255,255,.05)}
.exp-item .e-t{flex:1;min-width:0}
.exp-item .e-n{font-size:12px;font-weight:800}
.exp-item .e-d{font-size:9.5px;color:var(--ink3);margin-top:2px}
.exp-item .e-tag{font-size:9px;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(245,158,11,.15);color:#FCD34D;flex-shrink:0}
.exp-item.urgent .e-tag{background:rgba(239,68,68,.2);color:#FCA5A5}
.exp-empty{text-align:center;color:#34D399;font-size:11.5px;padding:20px 0}

/* 行业分类彩卡 */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:20px}
.cat-card{position:relative;border-radius:20px;padding:18px;border:1px solid var(--line2);overflow:hidden;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:all .25s;cursor:pointer}
.cat-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2)}
.cat-card::before{content:'';position:absolute;top:0;right:0;width:120px;height:120px;border-radius:50%;opacity:.25;pointer-events:none}
.cat-card.purple{background:linear-gradient(160deg,rgba(168,85,247,.12),rgba(168,85,247,.04));border-color:rgba(168,85,247,.25)}
.cat-card.purple::before{background:radial-gradient(circle,#A855F7,transparent 70%)}
.cat-card.pink{background:linear-gradient(160deg,rgba(236,72,153,.12),rgba(236,72,153,.04));border-color:rgba(236,72,153,.25)}
.cat-card.pink::before{background:radial-gradient(circle,#EC4899,transparent 70%)}
.cat-card.cyan{background:linear-gradient(160deg,rgba(34,211,238,.12),rgba(34,211,238,.04));border-color:rgba(34,211,238,.25)}
.cat-card.cyan::before{background:radial-gradient(circle,#22D3EE,transparent 70%)}
.cat-card .ct-hd{display:flex;align-items:center;gap:9px;margin-bottom:12px;position:relative;z-index:1}
.cat-card .ct-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cat-card.purple .ct-ic{background:rgba(168,85,247,.2)}
.cat-card.pink .ct-ic{background:rgba(236,72,153,.2)}
.cat-card.cyan .ct-ic{background:rgba(34,211,238,.2)}
.cat-card .ct-t{font-size:14px;font-weight:900;letter-spacing:-.3px}
.cat-card .ct-s{font-size:10px;color:var(--ink3);margin-top:2px}
.cat-card .ct-count{margin-left:auto;font-size:10px;font-weight:800;color:var(--ink2);padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);position:relative;z-index:1}
.cat-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;position:relative;z-index:1}
.cat-mini-item{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:9px;background:rgba(255,255,255,.04);font-size:10.5px;color:var(--ink2);font-weight:600;transition:all .15s;cursor:pointer;border:1px solid transparent}
.cat-mini-item:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.1)}
.cat-mini-item .ic{font-size:13px}

/* 快捷操作 */
.qa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.qa-card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid var(--line2);border-radius:18px;padding:16px;cursor:pointer;transition:all .25s;text-align:center;overflow:hidden}
.qa-card:hover{transform:translateY(-3px);border-color:rgba(168,85,247,.4)}
.qa-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#A855F7,#EC4899);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.qa-card:hover::after{transform:scaleX(1)}
.qa-ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(236,72,153,.2));display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.qa-ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qa-t{font-size:12.5px;font-weight:800}
.qa-d{font-size:9.5px;color:var(--ink3);margin-top:3px}

.foot-ver{text-align:center;font-size:10px;color:var(--ink4);margin-top:30px;padding:14px;letter-spacing:.5px}

/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(10,10,26,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:90;display:none}
.mask.show{display:block}

/* 加载 */
.loading{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:2;opacity:1;transition:opacity .2s}
.loading.hide{opacity:0;pointer-events:none}

function buildUrl(url){
  if(!url || url.indexOf('http') === 0) return url;
  const base = location.origin + location.pathname.replace(/cf-hub\.html$/, '');
  const sep = url.indexOf('?') >= 0 ? '&' : '?';
  if(HUB_FID && url.indexOf('fid=') < 0) return base + url + sep + 'fid=' + HUB_FID;
  return base + url;
}

  if(name.indexOf('时铭') >= 0) return '个人';
  if(name.indexOf('宝贝') >= 0 || name.indexOf('自动化') >= 0 || name.indexOf('全家桶') >= 0 || name.indexOf('行业') >= 0) return '业务产品';

function loadLS(k, fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }

function miniTrend(seed, color){
  // 生成 12 个点折线图，SVG
  const W=100,H=24;
  const max = Math.max.apply(null, seed) || 1;
  const min = Math.min.apply(null, seed) || 0;
  const range = max - min || 1;
  const pts = seed.map((v,i)=>{
    const x = (i/(seed.length-1)) * W;
    const y = H - ((v-min)/range) * H;
    return [x.toFixed(1), y.toFixed(1)];
  });
  const path = 'M' + pts.map(p=>p[0]+','+p[1]).join(' L');
  const area = path + ' L' + W + ',' + H + ' L0,' + H + ' Z';
  const gid = 'g' + Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".5"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${gid})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function priceNum(p){ return parseInt(String(p.price||'0').replace(/[^0-9]/g,''))||0; }
function endDays(end){
  if(!end) return 999;
  const e = new Date(end.replace(/-/g,'/'));
  return Math.floor((e - new Date()) / 86400000);
}

        </div>

    <!-- 双栏 -->
    <div class="dual-col">
      <div class="glass-card">
        <div class="gc-hd">
          <div class="gc-ic"><svg viewBox="0 0 24 24"><path d="M20 7h-4V4a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/></svg></div>
          <div class="gc-t">业务产品状态</div>
          <div class="gc-s">${products.length} 个产品</div>
        </div>
        <div class="biz-list">
          ${products.slice(0,6).map(p=>{
            const used = p.clients?p.clients.length:0;
            const total = parseInt(p.total)||20;
            const pct = total>0?Math.min(100,Math.round(used/total*100)):0;
            const full = used>=total;
            return `<div class="biz-card" onclick="navigate('${p.file||'wb-engine.html?sku='+p.id}','${esc(p.name)}','${guessSec(p.name)}')">
              <div class="bc-ic" style="background:linear-gradient(135deg,${p.color1||'#A855F7'},${p.color2||'#EC4899'})">${p.emo||'✨'}</div>
              <div class="bc-t">${esc(p.name)}</div>
              <div class="bc-bar">
                <div class="bc-meta"><span>${used}/${total}</span><span>${pct}%</span></div>
                <div class="bc-bar-bg"><div class="bc-bar-i" style="width:${pct}%"></div></div>

              <span class="bc-status ${full?'full':''}">${full?'满员':'在售'}</span>

      <div class="glass-card">

        <div class="exp-list">
          ${expList.length === 0 ? '<div class="exp-empty">✅ 暂无即将到期的客户</div>' : expList.slice(0,8).map(({p,c,d})=>`<div class="exp-item ${d<=7?'urgent':d<=15?'warn':''}">

            <div class="e-t">
              <div class="e-n">${esc(c.name||'客户')}</div>

        return `<div class="cat-card ${def.cls}" onclick="document.getElementById('industriesToggle').click()">

          </div>
          <div class="cat-mini">
            ${list.slice(0,8).map(i=>`<div class="cat-mini-item" onclick="event.stopPropagation();navigate('wb-engine.html?sku=${i.id}','${esc(i.n)}','业务产品')"><span class="ic">${i.emo}</span>${esc(i.n.replace('工作台','').replace('台',''))}</div>`).join('')}

        </div>`;
      }).join('')}

    <!-- 快捷操作 -->
    <div class="qa-grid">
      <div class="qa-card" onclick="navigate('authorize.html','授权管理中心','变现生态')">

      </div>

        <div class="qa-ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div>
        <div class="qa-t">商店</div>
        <div class="qa-d">成品工作台直购</div>
      </div>
      <div class="qa-card" onclick="navigate('invest-dashboard.html','经营看板','变现生态')">
        <div class="qa-ic"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><polyline points="7 14 11 10 15 14 19 8"/></svg></div>
        <div class="qa-t">经营看板</div>

      <div class="qa-card" onclick="navigate('partner.html','招商合作','变现生态')">
        <div class="qa-ic"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
        <div class="qa-t">招商合作</div>
        <div class="qa-d">合伙人 / 共创</div>
      </div>
    </div>

    <div class="foot-ver">Crazy Friday · 疯狂星期五 · 总工作台 v6.0 · 2024 现代玻璃拟态旗舰版</div>`;
}

document.getElementById('contentFrame').addEventListener('load', function(){
  document.getElementById('loading').classList.add('hide');
});

function reloadFrame(){ if(curUrl){ document.getElementById('contentFrame').src = curUrl; document.getElementById('loading').classList.remove('hide'); } }
function openNewTab(){ if(curUrl){ window.open(curUrl, '_blank'); } else { showOverview(); } }
let _sideTipShown = false;
function toggleSidebar(){
  const open = document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mask').classList.toggle('show');
  if(open && window.innerWidth<=768 && !_sideTipShown){
    _sideTipShown = true;
    setTimeout(()=>{
      const t=document.getElementById('toast');
      t.textContent='👆 点击右侧任意位置或 X 关闭抽屉';
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), 2500);
    }, 300);
  }
}
function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mask').classList.remove('show');
}

(function init(){
  const indSub = document.getElementById('industriesSub');
  indSub.style.display = 'none';
  try{
    const products = loadLS('wb_auth_products', []);
    const badge = document.getElementById('authBadge');
    if(badge && products.length) badge.textContent = products.length;
  }catch(e){}
  showOverview();
})();
</script>
