<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="description" content="Crazy Friday · 总工作台 6.0 · AI 时代的商业操作系统">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="zh-CN">
<title>Crazy Friday · 总工作台 6.0</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a1a;--bg2:#110820;--bg3:#1a0d2e;
  --ink:#fff;--ink2:#d8dae8;--ink3:#a0a4b8;--ink4:#6d7088;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --primary:#7C3AED;--primary2:#A855F7;--purple:#C084FC;
  --pink:#EC4899;--pink2:#F472B6;--teal:#5EEAD4;
  --amber:#F59E0B;--red:#EF4444;--green:#10B981;--blue:#3B82F6;
  --sidebar-w:264px;--sidebar-w-mini:64px;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
}
html,body{background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(168,85,247,.13) 1px,transparent 1px);background-size:30px 30px;opacity:.5}
body::after{content:'';position:fixed;top:-220px;left:50%;transform:translateX(-50%);width:780px;height:560px;border-radius:50%;background:radial-gradient(ellipse,rgba(168,85,247,.3),transparent 70%);pointer-events:none;z-index:0}

.layout{position:relative;z-index:1;min-height:100vh}

/* ==================== PC 侧栏 ==================== */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
  background:linear-gradient(180deg,rgba(19,16,36,.96),rgba(13,10,30,.96));
  border-right:1px solid var(--line2);
  display:flex;flex-direction:column;
  z-index:50;transition:width .3s ease, transform .3s ease;
  overflow:hidden;padding-top:var(--safe-t);
}
.sidebar.mini{width:var(--sidebar-w-mini)}
.sidebar-header{
  padding:18px 18px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;position:relative;flex-shrink:0;
}
.sidebar-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#7C3AED,#EC4899);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:Georgia,serif;font-size:14px;font-weight:900;
  box-shadow:0 4px 14px rgba(168,85,247,.45);flex-shrink:0;
}
.sidebar-brand{flex:1;min-width:0;overflow:hidden}
.sidebar-brand .b1{font-family:Georgia,serif;font-size:16px;font-weight:900;letter-spacing:-.3px;background:linear-gradient(135deg,#fff,#C084FC 60%,#F472B6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.sidebar-brand .b2{font-size:9.5px;color:var(--ink3);margin-top:2px;letter-spacing:.3px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.sidebar-mini .sidebar-brand{display:none}
.sidebar-toggle{
  width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);flex-shrink:0;
}
.sidebar-toggle:active{transform:scale(.94)}
.sidebar-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.sidebar-mini .sidebar-toggle{margin:0 auto}
.sidebar-mini .sidebar-toggle svg{transform:rotate(180deg)}

.sidebar-search{padding:12px 14px 8px;border-bottom:1px solid var(--line);flex-shrink:0}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;transition:border-color .15s, background .15s;
}
.search-box:focus-within{border-color:rgba(168,85,247,.5);background:rgba(168,85,247,.06)}
.search-box svg{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2;flex-shrink:0}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-size:12.5px;font-family:inherit;min-width:0}
.search-box input::placeholder{color:var(--ink4)}
.sidebar-mini .sidebar-search{padding:10px 8px 8px}
.sidebar-mini .search-box{padding:8px;justify-content:center}
.sidebar-mini .search-box input,.sidebar-mini .search-box svg{display:none}
.sidebar-mini .search-box::after{content:'🔍';font-size:15px}

.sidebar-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0 14px;-webkit-overflow-scrolling:touch}
.sidebar-body::-webkit-scrollbar{width:3px}
.sidebar-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

.fav-section{padding:6px 14px;margin-bottom:6px}
.fav-title{font-size:8.5px;font-weight:800;color:var(--ink3);letter-spacing:1px;text-transform:uppercase;padding:6px 4px;display:flex;align-items:center;gap:5px}
.fav-title::before{content:'';width:3px;height:8px;background:linear-gradient(180deg,#7C3AED,#EC4899);border-radius:2px}
.fav-list{display:flex;flex-direction:column;gap:1px}
.fav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;
  color:var(--ink2);font-size:12px;font-weight:600;transition:all .15s;text-decoration:none;
}
.fav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.fav-item:active{background:rgba(168,85,247,.1)}
.fav-item .ic{font-size:14px;width:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.fav-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-mini .fav-item{justify-content:center;padding:8px}
.sidebar-mini .fav-item .nm{display:none}
.sidebar-mini .fav-item .ic{font-size:16px;width:auto}

.nav-group{margin-bottom:4px}
.nav-group-head{
  display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;
  color:var(--ink2);font-size:12.5px;font-weight:700;border-radius:8px;margin:0 6px;
  transition:all .15s;user-select:none;
}
.nav-group-head:hover{background:rgba(255,255,255,.04);color:#fff}
.nav-group-head:active{background:rgba(168,85,247,.1)}
.nav-group-head .ic{font-size:14px;width:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-group-head .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-group-head .ar{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s;flex-shrink:0}
.nav-group.open .nav-group-head .ar{transform:rotate(90deg)}
.sidebar-mini .nav-group-head .nm,.sidebar-mini .nav-group-head .ar{display:none}
.sidebar-mini .nav-group-head{justify-content:center;padding:10px 0}
.nav-group-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.nav-group.open .nav-group-body{max-height:600px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 14px 8px 42px;
  border-radius:8px;cursor:pointer;color:var(--ink3);
  font-size:12px;font-weight:600;margin:0 6px;position:relative;
  transition:all .15s;text-decoration:none;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item:active{background:rgba(168,85,247,.1)}
.nav-item.active{background:linear-gradient(90deg,rgba(168,85,247,.18),rgba(236,72,153,.06));color:#fff;box-shadow:inset 2px 0 0 #A855F7}
.nav-item .ic{font-size:13px;width:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .badge{margin-left:auto;font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:5px;background:rgba(168,85,247,.3);color:#d8b4fe;flex-shrink:0}
.nav-item .badge.new{background:rgba(16,185,129,.2);color:#34D399}
.nav-item .badge.soon{background:rgba(245,158,11,.2);color:#FBBF24}
.sidebar-mini .nav-item{padding:8px 0;justify-content:center}
.sidebar-mini .nav-item .nm,.sidebar-mini .nav-item .badge{display:none}
.sidebar-mini .nav-item .ic{font-size:15px;width:auto}

.sidebar-foot{
  padding:12px 14px;border-top:1px solid var(--line);
  background:rgba(255,255,255,.02);flex-shrink:0;
}
.foot-status{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--ink3);line-height:1.5}
.foot-status .dot{width:6px;height:6px;border-radius:50%;background:#10B981;box-shadow:0 0 6px rgba(16,185,129,.8);flex-shrink:0}
.foot-ver{font-family:ui-monospace,Menlo,monospace;color:var(--ink4);font-size:9px;margin-top:4px}
.sidebar-mini .foot-status .t,.sidebar-mini .foot-ver{display:none}
.sidebar-mini .foot-status{justify-content:center}

/* ==================== Drawer (Mobile 专用) ==================== */
.drawer-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:199;opacity:0;pointer-events:none;transition:opacity .3s ease;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.drawer-mask.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:75%;max-width:340px;min-width:280px;
  background:linear-gradient(180deg,#1a0d2e 0%,#0a0a1a 100%);
  border-right:1px solid var(--line2);
  z-index:200;transform:translateX(-100%);transition:transform .3s ease;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);
  box-shadow:8px 0 30px rgba(0,0,0,.5);
}
.drawer.open{transform:translateX(0)}
.drawer-header{
  padding:16px 18px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative;
}
.drawer-mark{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,#7C3AED,#EC4899);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:Georgia,serif;font-size:15px;font-weight:900;
  box-shadow:0 4px 14px rgba(168,85,247,.4);flex-shrink:0;
}
.drawer-brand{flex:1;min-width:0}
.drawer-brand .b1{font-family:Georgia,serif;font-size:18px;font-weight:900;letter-spacing:-.4px;background:linear-gradient(135deg,#fff,#C084FC 60%,#F472B6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.drawer-brand .b2{font-size:10.5px;color:var(--ink2);margin-top:2px;font-weight:600;letter-spacing:.3px}
.drawer-close{
  width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex-shrink:0;
}
.drawer-close:active{transform:scale(.92);background:rgba(168,85,247,.15)}
.drawer-close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.drawer-search{padding:12px 16px 8px;flex-shrink:0}
.drawer-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0 12px;-webkit-overflow-scrolling:touch}
.drawer-body::-webkit-scrollbar{width:3px}
.drawer-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.drawer-foot{padding:12px 16px;border-top:1px solid var(--line);background:rgba(255,255,255,.02);flex-shrink:0;font-size:9.5px;color:var(--ink3);line-height:1.7}

/* ==================== Mobile Topbar ==================== */
.topbar-mobile{
  display:none;position:sticky;top:0;z-index:80;
  height:calc(56px + var(--safe-t));padding-top:var(--safe-t);
  background:linear-gradient(180deg,rgba(10,10,26,.92),rgba(10,10,26,.7));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  align-items:center;padding-left:14px;padding-right:14px;gap:10px;
}
.menu-btn{
  width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex-shrink:0;
}
.menu-btn:active{transform:scale(.94);background:rgba(168,85,247,.15)}
.menu-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.topbar-mobile .brand-m{flex:1;min-width:0}
.topbar-mobile .brand-m .b1{font-family:Georgia,serif;font-size:15px;font-weight:900;background:linear-gradient(135deg,#fff,#C084FC);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.3px;line-height:1.1}
.topbar-mobile .brand-m .b2{font-size:9.5px;color:var(--ink3);margin-top:1px;letter-spacing:.2px}
.topbar-mobile .version-pill{
  font-size:9px;font-weight:800;padding:5px 9px;border-radius:14px;
  background:rgba(168,85,247,.18);color:#d8b4fe;border:1px solid rgba(168,85,247,.3);
  letter-spacing:.5px;flex-shrink:0;
}

/* ==================== Main ==================== */
.main{
  margin-left:var(--sidebar-w);min-height:100vh;min-width:0;
  transition:margin-left .3s ease;position:relative;z-index:1;padding-bottom:40px;
}
.main.mini{margin-left:var(--sidebar-w-mini)}
.content{max-width:880px;margin:0 auto;padding:28px 28px 40px;min-width:0}
.content.no-pad-top{padding-top:0}

.crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);margin-bottom:14px;flex-wrap:wrap}
.crumb .b-sep{opacity:.5}
.crumb .b-now{color:#fff;font-weight:600}
.crumb .b-prev{cursor:pointer;transition:color .15s}
.crumb .b-prev:hover{color:#fff}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;overflow:hidden;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);pointer-events:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 16px;border:none;border-radius:11px;
  background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff;font-size:12.5px;font-weight:800;
  cursor:pointer;text-decoration:none;letter-spacing:.3px;
  box-shadow:0 6px 18px rgba(168,85,247,.3);transition:all .15s;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line2);color:#fff;box-shadow:none}

/* Hero */
.hero{
  position:relative;border-radius:22px;padding:24px 24px 22px;
  background:linear-gradient(180deg,rgba(168,85,247,.1),rgba(236,72,153,.05));
  border:1px solid rgba(168,85,247,.25);
  margin-bottom:18px;overflow:hidden;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;gap:20px;align-items:center;
}
.hero::before{content:'';position:absolute;top:-80px;right:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.25),transparent 70%);pointer-events:none}
.hero-left{flex:1;min-width:0;position:relative;z-index:1}
.hero-right{flex-shrink:0;position:relative;z-index:1;width:130px;height:130px;display:flex;align-items:center;justify-content:center}
.hero-cube{
  width:130px;height:130px;border-radius:22px;
  background:linear-gradient(135deg,#A855F7,#EC4899 70%,#F472B6);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:Georgia,serif;font-size:36px;font-weight:900;
  box-shadow:0 16px 48px rgba(168,85,247,.45),inset 0 1px 0 rgba(255,255,255,.3);position:relative;
}
.hero-cube::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:80px;height:6px;border-radius:3px;background:rgba(168,85,247,.4);filter:blur(8px)}
.hero-h{font-family:Georgia,serif;font-size:22px;font-weight:900;letter-spacing:-.5px;line-height:1.15;background:linear-gradient(135deg,#fff,#C084FC 60%,#F472B6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.6}
.hero-meta{font-size:10.5px;color:var(--ink3);line-height:1.7;margin-top:10px}
.hero-meta b{color:#fff;font-weight:600}
.hero-cta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero-cta .btn{font-size:12px;padding:0 14px;min-height:38px}

.section{margin-bottom:18px}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-hd h2{font-size:14.5px;font-weight:900;color:#fff;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
.sec-hd h2::before{content:'';width:3px;height:14px;background:linear-gradient(180deg,#7C3AED,#EC4899);border-radius:2px}
.sec-hd .more{font-size:10.5px;font-weight:800;color:var(--ink3);margin-left:auto;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;transition:all .15s}
.sec-hd .more:hover{color:#d8b4fe;border-color:rgba(168,85,247,.3)}

.grid{display:grid;gap:11px}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}

.mod-card{
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:all .2s ease;display:flex;align-items:center;gap:11px;
  text-decoration:none;color:inherit;
}
.mod-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);pointer-events:none}
.mod-card:hover{border-color:rgba(168,85,247,.4);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.mod-card:active{transform:scale(.98)}
.mod-card .ic{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(236,72,153,.1));
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  border:1px solid rgba(255,255,255,.06);
}
.mod-card .body{flex:1;min-width:0}
.mod-card .nm{font-size:13.5px;font-weight:800;color:#fff;line-height:1.2;letter-spacing:-.2px}
.mod-card .de{font-size:10.5px;color:var(--ink3);margin-top:3px;line-height:1.4}
.mod-card .ar{font-size:14px;color:var(--ink3);font-weight:900}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.stat-card{
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line2);border-radius:14px;padding:14px 8px;text-align:center;
  position:relative;overflow:hidden;
}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);pointer-events:none}
.stat-card .n{font-size:24px;font-weight:900;line-height:1;background:linear-gradient(135deg,#fff,#C084FC);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.stat-card .n.g{background:linear-gradient(135deg,#34D399,#10B981);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .l{font-size:10px;color:var(--ink3);margin-top:5px;font-weight:700;letter-spacing:.3px}

.quote-card{
  background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(236,72,153,.06));
  border:1px solid rgba(168,85,247,.25);border-radius:18px;padding:20px;
  margin-bottom:18px;position:relative;overflow:hidden;
}
.quote-card .q-mark{font-size:42px;color:rgba(168,85,247,.4);font-family:Georgia,serif;line-height:1;position:absolute;top:6px;left:14px}
.quote-card .q{font-size:14px;font-weight:600;color:#fff;line-height:1.7;margin-left:28px;margin-bottom:6px}
.quote-card .q .grad{background:linear-gradient(135deg,#EC4899,#F472B6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.quote-card .sub{font-size:12.5px;color:var(--ink2);line-height:1.85;margin-left:28px}

.placeholder{text-align:center;padding:40px 20px;color:var(--ink3)}
.placeholder .ic{font-size:48px;margin-bottom:10px;opacity:.5}

const ALL_MODULES = (() => {

      list.push({ gid:g.id, id:g.id, name:g.name, icon:g.icon, desc:g.desc, url:'#' + g.id, group:g.id });

      g.items.forEach(it => list.push({ gid:g.id, ...it, group:g.name }));

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderSidebar(){
  const body = document.getElementById('sidebarBody');

  let html = '';

  // 常用区
  if(!q){
    const favs = State.recents.map(id => ALL_MODULES.find(m => m.id === id)).filter(Boolean);
    if(favs.length){
      html += '<div class="fav-section"><div class="fav-title">⭐ 最近使用</div><div class="fav-list">';
      favs.forEach(m => {
        const onclick = m.status === 'soon' ? `onclick="event.preventDefault();toast('🚀 ${esc(m.name)} 即将上线')"` : '';
        const url = m.status === 'soon' ? '#' : (m.url || '#' + m.gid);
        html += `<a class="fav-item" href="${url}" ${onclick} data-id="${m.id}" data-gid="${m.gid}"><span class="ic">${m.icon||'▫'}</span><span class="nm">${esc(m.name)}</span></a>`;
      });
      html += '</div></div>';
    }
  }

    if(g.standalone){
      const active = State.route === g.id ? 'active' : '';

      items = items.filter(it => (it.name + (it.desc||'')).toLowerCase().includes(q));
      if(items.length === 0) return;
    }

    html += `<div class="nav-group ${isOpen?'open':''}">`;
    html += `<div class="nav-group-head" data-gid="${g.id}"><span class="ic">${g.icon}</span><span class="nm">${g.name}</span><svg class="ar" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>`;

      const active = State.route === it.id ? 'active' : '';
      const badge = it.badge ? `<span class="badge ${it.badge==='NEW'?'new':''} ${it.badge==='SOON'?'soon':''}">${esc(it.badge)}</span>` : (it.status === 'soon' ? '<span class="badge soon">SOON</span>' : (it.status === 'new' ? '<span class="badge new">NEW</span>' : ''));

function bindNavEvents(){
  document.querySelectorAll('#sidebarBody .nav-group-head').forEach(h => {
    h.addEventListener('click', () => {
      const gid = h.dataset.gid;
      if(State.openGroups.has(gid)) State.openGroups.delete(gid);
      else State.openGroups.add(gid);
      renderSidebar();
    });
  });
  document.querySelectorAll('#sidebarBody .nav-item, #sidebarBody .fav-item').forEach(a => {
    a.addEventListener('click', e => {
      const href = a.getAttribute('href');
      if(href && href.startsWith('javascript:')) return;
      if(href && href.startsWith('#')){
        e.preventDefault();
        navigate(a.dataset.id || a.dataset.gid);
      } else if(href && !href.startsWith('#')){
        e.preventDefault();
        window.open(href, '_blank');
        if(a.dataset.id) recordRecent(a.dataset.id);
      }
    });
  });
}

function bindDrawerEvents(){
  document.querySelectorAll('#drawerBody .nav-group-head').forEach(h => {
    h.addEventListener('click', () => {
      const gid = h.dataset.gid;
      if(State.openGroups.has(gid)) State.openGroups.delete(gid);
      else State.openGroups.add(gid);
      renderDrawer();
    });
  });
  document.querySelectorAll('#drawerBody .nav-item, #drawerBody .fav-item').forEach(a => {
    a.addEventListener('click', e => {
      const href = a.getAttribute('href');
      if(href && href.startsWith('javascript:')) return;
      if(href && href.startsWith('#')){
        e.preventDefault();
        navigate(a.dataset.id || a.dataset.gid);
        closeDrawer();
      } else if(href && !href.startsWith('#')){
        e.preventDefault();
        window.open(href, '_blank');
        if(a.dataset.id) recordRecent(a.dataset.id);
        closeDrawer();
      }
    });
  });
}

function navigate(routeId){
  State.route = routeId;
  recordRecent(routeId);
  if(routeId === 'incubator') State.openGroups.add('entrepreneur');
  renderSidebar();
  renderDrawer();
  renderContent();
  history.replaceState(null, '', '#' + routeId);
  window.scrollTo({top:0, behavior:'smooth'});
}

function recordRecent(id){
  State.recents = [id, ...State.recents.filter(x => x !== id)].slice(0, 5);
}

function renderContent(){
  const c = document.getElementById('content');
  const route = State.route;
  if(route === 'home' || !route) return renderHome(c);
  if(route === 'incubator') return renderIncubator(c);
  const m = ALL_MODULES.find(x => x.id === route);
  if(!m) return renderHome(c);
  if(m.url && m.url !== '#' + m.id) return renderExternal(c, m);
  return renderPlaceholder(c, m);
}

  const authUsed = authProds.reduce((s,p)=>s+(p.clients?p.clients.length:0),0);
  const authTotal = authProds.reduce((s,p)=>s+(parseInt(p.total)||0),0);

  c.innerHTML = `
    <div class="crumb"><span class="b-prev">Crazy Friday</span><span class="b-sep">›</span><span class="b-now">总览</span></div>

function bindCardEvents(){
  document.querySelectorAll('.mod-card[data-id]').forEach(a => {
    a.addEventListener('click', e => {
      const href = a.getAttribute('href');
      if(href && href.startsWith('javascript:')) return;
      if(href && !href.startsWith('#')){
        e.preventDefault();
        window.open(href, '_blank');
        if(a.dataset.id) recordRecent(a.dataset.id);
      } else if(a.dataset.id){
        e.preventDefault();
        navigate(a.dataset.id);
      }
    });
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 1800);
}

document.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  renderDrawer();
  let r = (location.hash || '').slice(1) || 'home';
  if(!ALL_MODULES.some(m => m.id === r)) r = 'home';
  State.route = r;
  renderContent();

  document.getElementById('sidebarToggle').addEventListener('click', toggleSidebarMini);
  document.getElementById('menuBtn').addEventListener('click', openDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerMask').addEventListener('click', closeDrawer);
  if(location.search.indexOf('drawer=open') >= 0) setTimeout(openDrawer, 50);

  const onSearch = (e) => {
    State.searchQ = e.target.value;
    renderSidebar();
    renderDrawer();
  };
  document.getElementById('searchInput').addEventListener('input', onSearch);
  document.getElementById('drawerSearch').addEventListener('input', onSearch);

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeDrawer();
  });

  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').slice(1);
    if(h && ALL_MODULES.some(m => m.id === h) && h !== State.route){
      State.route = h;
      renderSidebar();
      renderDrawer();
      renderContent();
    }
  });
});
