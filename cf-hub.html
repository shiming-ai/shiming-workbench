<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="description" content="Crazy Friday · 总工作台 6.0 · AI 时代的商业操作系统">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="zh-CN">
<title>Crazy Friday · 总工作台 6.0</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F7F8FB;--bg2:#EEF0F5;--card:#FFFFFF;
  --ink:#1A1D29;--ink2:#5A6072;--ink3:#9298AB;--ink4:#C5C9D4;
  --line:#E8EAEF;--line2:#DFE2E9;
  --primary:#5B5BD6;--primary2:#7C6FF0;--purple:#8B5CF6;
  --pink:#EC4899;--teal:#10B981;--amber:#F59E0B;
  --grad:linear-gradient(135deg,#5B5BD6,#8B5CF6 50%,#EC4899);
  --shadow:0 1px 2px rgba(20,24,40,.04),0 2px 8px rgba(20,24,40,.05);
  --shadow-md:0 4px 16px rgba(20,24,40,.08);
  --radius:16px;--radius-lg:22px;
  --sidebar-w:264px;--sidebar-w-mini:64px;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
}
html,body{background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative}

.layout{position:relative;z-index:1;min-height:100vh}

/* ==================== PC 侧栏（白底） ==================== */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);
  background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  z-index:50;transition:width .3s ease, transform .3s ease;
  overflow:hidden;padding-top:var(--safe-t);
}
.sidebar.mini{width:var(--sidebar-w-mini)}
.sidebar-header{
  padding:16px 16px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;position:relative;flex-shrink:0;
}
.sidebar-mark{
  width:36px;height:36px;border-radius:11px;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:Georgia,serif;font-size:14px;font-weight:900;
  box-shadow:0 4px 12px rgba(124,99,244,.35);flex-shrink:0;
}
.sidebar-brand{flex:1;min-width:0;overflow:hidden}
.sidebar-brand .b1{font-family:Georgia,serif;font-size:17px;font-weight:900;letter-spacing:-.3px;color:var(--ink);line-height:1.1;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.sidebar-brand .b2{font-size:10px;color:var(--ink3);margin-top:2px;letter-spacing:.2px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.sidebar-mini .sidebar-brand{display:none}
.sidebar-toggle{
  width:30px;height:30px;border-radius:9px;background:var(--bg);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink3);
  flex-shrink:0;
}
.sidebar-toggle:active{transform:scale(.94)}
.sidebar-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.sidebar-mini .sidebar-toggle{margin:0 auto}
.sidebar-mini .sidebar-toggle svg{transform:rotate(180deg)}

.sidebar-search{padding:12px 14px 8px;border-bottom:1px solid var(--line);flex-shrink:0}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px;transition:all .15s;
}
.search-box:focus-within{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(91,91,214,.08)}
.search-box svg{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2;flex-shrink:0}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-size:12.5px;font-family:inherit;min-width:0}
.search-box input::placeholder{color:var(--ink4)}
.sidebar-mini .sidebar-search{padding:10px 8px 8px}
.sidebar-mini .search-box{padding:8px;justify-content:center}
.sidebar-mini .search-box input,.sidebar-mini .search-box svg{display:none}
.sidebar-mini .search-box::after{content:'🔍';font-size:15px}

.sidebar-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0 14px;-webkit-overflow-scrolling:touch}
.sidebar-body::-webkit-scrollbar{width:3px}
.sidebar-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}

.fav-section{padding:6px 14px;margin-bottom:6px}
.fav-title{font-size:8.5px;font-weight:800;color:var(--ink3);letter-spacing:1px;text-transform:uppercase;padding:6px 4px;display:flex;align-items:center;gap:5px}
.fav-title::before{content:'';width:3px;height:8px;background:var(--grad);border-radius:2px}
.fav-list{display:flex;flex-direction:column;gap:1px}
.fav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;
  color:var(--ink2);font-size:12px;font-weight:600;transition:all .15s;text-decoration:none;
}
.fav-item:hover{background:var(--bg);color:var(--ink)}
.fav-item:active{background:rgba(91,91,214,.06)}
.fav-item .ic{font-size:14px;width:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.fav-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-mini .fav-item{justify-content:center;padding:8px}
.sidebar-mini .fav-item .nm{display:none}
.sidebar-mini .fav-item .ic{font-size:16px;width:auto}

.nav-group{margin-bottom:4px}
.nav-group-head{
  display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;
  color:var(--ink);font-size:12.5px;font-weight:700;border-radius:9px;margin:0 6px;
  transition:all .15s;user-select:none;
}
.nav-group-head:hover{background:var(--bg);color:var(--ink)}
.nav-group-head:active{background:rgba(91,91,214,.05)}
.nav-group-head .ic{font-size:14px;width:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-group-head .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-group-head .ar{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s;flex-shrink:0}
.nav-group.open .nav-group-head .ar{transform:rotate(90deg)}
.sidebar-mini .nav-group-head .nm,.sidebar-mini .nav-group-head .ar{display:none}
.sidebar-mini .nav-group-head{justify-content:center;padding:10px 0}
.nav-group-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.nav-group.open .nav-group-body{max-height:600px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 14px 8px 42px;
  border-radius:9px;cursor:pointer;color:var(--ink3);
  font-size:12px;font-weight:600;margin:0 6px;position:relative;
  transition:all .15s;text-decoration:none;
}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item:active{background:rgba(91,91,214,.05)}
.nav-item.active{background:rgba(91,91,214,.07);color:var(--primary);box-shadow:inset 2px 0 0 var(--primary);font-weight:700}
.nav-item .ic{font-size:13px;width:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .badge{margin-left:auto;font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:5px;background:rgba(91,91,214,.08);color:var(--primary);flex-shrink:0}
.nav-item .badge.new{background:rgba(16,185,129,.1);color:var(--teal)}
.nav-item .badge.soon{background:rgba(245,158,11,.1);color:var(--amber)}
.sidebar-mini .nav-item{padding:8px 0;justify-content:center}
.sidebar-mini .nav-item .nm,.sidebar-mini .nav-item .badge{display:none}
.sidebar-mini .nav-item .ic{font-size:15px;width:auto}

.sidebar-foot{padding:12px 14px;border-top:1px solid var(--line);background:var(--bg);flex-shrink:0}
.foot-status{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--ink3);line-height:1.5}
.foot-status .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px rgba(16,185,129,.5);flex-shrink:0}
.foot-ver{font-family:ui-monospace,Menlo,monospace;color:var(--ink4);font-size:9px;margin-top:4px}
.sidebar-mini .foot-status .t,.sidebar-mini .foot-ver{display:none}
.sidebar-mini .foot-status{justify-content:center}

/* ==================== Drawer (Mobile 白底) ==================== */
.drawer-mask{
  position:fixed;inset:0;background:rgba(16,18,30,.4);
  z-index:199;opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.drawer-mask.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:75%;max-width:340px;min-width:280px;
  background:#fff;border-right:1px solid var(--line);
  z-index:200;transform:translateX(-100%);transition:transform .3s ease;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);
  box-shadow:8px 0 30px rgba(20,24,40,.15);
}
.drawer.open{transform:translateX(0)}
.drawer-header{
  padding:16px 18px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative;
}
.drawer-mark{
  width:38px;height:38px;border-radius:12px;
  background:var(--grad);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:Georgia,serif;font-size:15px;font-weight:900;
  box-shadow:0 4px 12px rgba(124,99,244,.3);flex-shrink:0;
}
.drawer-brand{flex:1;min-width:0}
.drawer-brand .b1{font-family:Georgia,serif;font-size:18px;font-weight:900;letter-spacing:-.4px;color:var(--ink);line-height:1.1}
.drawer-brand .b2{font-size:10.5px;color:var(--ink3);margin-top:2px;font-weight:600;letter-spacing:.3px}
.drawer-close{
  width:34px;height:34px;border-radius:10px;background:var(--bg);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);flex-shrink:0;
}
.drawer-close:active{transform:scale(.92);background:rgba(91,91,214,.06)}
.drawer-close svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.drawer-search{padding:12px 16px 8px;flex-shrink:0}
.drawer-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0 12px;-webkit-overflow-scrolling:touch}
.drawer-body::-webkit-scrollbar{width:3px}
.drawer-body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.drawer-foot{padding:12px 16px;border-top:1px solid var(--line);background:var(--bg);flex-shrink:0;font-size:9.5px;color:var(--ink3);line-height:1.7}

/* ==================== Mobile Topbar（白底） ==================== */
.topbar-mobile{
  display:none;position:sticky;top:0;z-index:80;
  height:calc(56px + var(--safe-t));padding-top:var(--safe-t);
  background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  align-items:center;padding-left:14px;padding-right:14px;gap:10px;
}
.menu-btn{
  width:40px;height:40px;border-radius:11px;background:var(--bg);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0;
}
.menu-btn:active{transform:scale(.94);background:rgba(91,91,214,.06)}
.menu-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.topbar-mobile .brand-m{flex:1;min-width:0}
.topbar-mobile .brand-m .b1{font-family:Georgia,serif;font-size:15px;font-weight:900;color:var(--ink);letter-spacing:-.3px;line-height:1.1}
.topbar-mobile .brand-m .b2{font-size:9.5px;color:var(--ink3);margin-top:1px;letter-spacing:.2px}
.topbar-mobile .version-pill{
  font-size:9px;font-weight:800;padding:5px 9px;border-radius:14px;
  background:rgba(91,91,214,.08);color:var(--primary);border:1px solid rgba(91,91,214,.15);
  letter-spacing:.5px;flex-shrink:0;
}

/* ==================== Main ==================== */
.main{
  margin-left:var(--sidebar-w);min-height:100vh;min-width:0;
  transition:margin-left .3s ease;position:relative;z-index:1;padding-bottom:40px;
}
.main.mini{margin-left:var(--sidebar-w-mini)}
.content{max-width:900px;margin:0 auto;padding:28px 28px 40px;min-width:0}

.crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);margin-bottom:14px;flex-wrap:wrap}
.crumb .b-sep{opacity:.5}
.crumb .b-now{color:var(--ink);font-weight:600}
.crumb .b-prev{cursor:pointer;transition:color .15s}
.crumb .b-prev:hover{color:var(--primary)}

.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:42px;padding:0 18px;border:none;border-radius:12px;
  background:var(--grad);color:#fff;font-size:13px;font-weight:700;
  cursor:pointer;text-decoration:none;letter-spacing:.2px;
  box-shadow:0 4px 14px rgba(124,99,244,.3);transition:all .15s;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;border:1.5px solid var(--line2);color:var(--ink);box-shadow:none}
.btn.ghost:active{background:var(--bg)}

/* Hero（白底 + 右侧 3D 插画） */
.hero{
  position:relative;border-radius:var(--radius-lg);
  background:linear-gradient(135deg,#fff 0%,#F5F4FF 100%);
  border:1px solid var(--line);
  padding:32px 28px;margin-bottom:20px;overflow:hidden;
  box-shadow:var(--shadow-md);
  display:flex;gap:24px;align-items:center;
}
.hero::before{content:'';position:absolute;top:-60px;right:20px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(124,99,244,.1),transparent 70%);pointer-events:none}
.hero-left{flex:1;min-width:0;position:relative;z-index:1}
.hero-right{flex-shrink:0;position:relative;z-index:1;display:flex;align-items:center;justify-content:center}
.hero-h{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1.15;color:var(--ink)}
.hero-h .grad{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:13.5px;color:var(--ink2);margin-top:8px;line-height:1.7}
.hero-cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

.section{margin-bottom:20px}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-hd h2{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
.sec-hd h2::before{content:'';width:3px;height:14px;background:var(--grad);border-radius:2px}
.sec-hd .more{font-size:10.5px;font-weight:700;color:var(--ink3);margin-left:auto;padding:4px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:all .15s}
.sec-hd .more:hover{color:var(--primary);border-color:rgba(91,91,214,.3)}

.grid{display:grid;gap:12px}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}

.mod-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:all .2s ease;display:flex;align-items:center;gap:12px;
  text-decoration:none;color:inherit;box-shadow:var(--shadow);
}
.mod-card:hover{border-color:rgba(91,91,214,.3);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.mod-card:active{transform:scale(.98)}
.mod-card .ic{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,rgba(124,99,244,.1),rgba(236,72,153,.06));
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  border:1px solid rgba(124,99,244,.08);
}
.mod-card .body{flex:1;min-width:0}
.mod-card .nm{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-.2px}
.mod-card .de{font-size:10.5px;color:var(--ink3);margin-top:3px;line-height:1.4}
.mod-card .ar{font-size:14px;color:var(--ink4);font-weight:900}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.stat-card .n{font-size:26px;font-weight:900;line-height:1;color:var(--primary);letter-spacing:-.5px}
.stat-card .n.g{color:var(--teal)}
.stat-card .n.amber{color:var(--amber)}
.stat-card .l{font-size:10px;color:var(--ink3);margin-top:5px;font-weight:600;letter-spacing:.3px}

.quote-card{
  background:linear-gradient(135deg,#F7F5FF,#FDF2F8);
  border:1px solid rgba(124,99,244,.15);border-radius:var(--radius-lg);padding:22px;
  margin-bottom:20px;position:relative;overflow:hidden;
}
.quote-card .q-mark{font-size:42px;color:rgba(124,99,244,.3);font-family:Georgia,serif;line-height:1;position:absolute;top:6px;left:14px}
.quote-card .q{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.7;margin-left:30px;margin-bottom:6px}
.quote-card .q .grad{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.quote-card .sub{font-size:12.5px;color:var(--ink2);line-height:1.85;margin-left:30px}

.placeholder{text-align:center;padding:40px 20px;color:var(--ink3)}
.placeholder .ic{font-size:48px;margin-bottom:10px;opacity:.4}
.placeholder .t{font-size:15px;font-weight:800;color:var(--ink2);margin-bottom:4px}
.placeholder .d{font-size:11.5px;line-height:1.6}

.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(20,24,40,.9);color:#fff;font-size:12.5px;padding:11px 18px;border-radius:12px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}

/* ==================== Responsive ==================== */
@media (max-width:1023px){
  .sidebar{transform:translateX(-100%);box-shadow:4px 0 30px rgba(20,24,40,.12)}
  .sidebar.open{transform:translateX(0)}
  .main,.main.mini{margin-left:0}
  .topbar-mobile{display:flex}
}
@media (min-width:1024px){
  .drawer,.drawer-mask{display:none !important}
  .topbar-mobile{display:none !important}
  .menu-btn{display:none}
}
@media (max-width:767px){
  .content{padding:16px 16px 30px}
  .grid.cols-3{grid-template-columns:1fr}
  .grid.cols-2{grid-template-columns:1fr}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .hero{flex-direction:column;padding:22px 18px}
  .hero-right{order:-1}
  .hero-h{font-size:24px}
  .hero-sub{font-size:12.5px}
  .hero-cta{flex-direction:column;align-items:stretch}
  .hero-cta .btn{justify-content:center}
  .crumb{font-size:10.5px}
}
@media (min-width:768px) and (max-width:1023px){
  .grid.cols-3{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="layout">

  <!-- ===== PC 侧栏 ===== -->
  <aside class="sidebar" id="sidebar" aria-label="侧栏导航">
    <div class="sidebar-header">
      <div class="sidebar-mark">CF</div>
      <div class="sidebar-brand">
        <div class="b1">Crazy Friday</div>
        <div class="b2">疯狂星期五 ｜ 一人公司 AI 生态</div>
      </div>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="折叠侧栏"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    </div>
    <div class="sidebar-search">
      <label class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="搜索工作台 / 项目 / AI 工具" autocomplete="off">
      </label>
    </div>
    <div class="sidebar-body" id="sidebarBody"></div>
    <div class="sidebar-foot">
      <div class="foot-status"><span class="dot"></span><span class="t">实时同步 · v7.0</span></div>
      <div class="foot-ver">Crazy Friday © 2026</div>

function bindNavEvents(){

      else State.openGroups.add(gid);
      renderSidebar();
    });
  });
  document.querySelectorAll('#sidebarBody .nav-item, #sidebarBody .fav-item').forEach(a => {
    a.addEventListener('click', e => {
      const href = a.getAttribute('href');
      if(href && href.startsWith('javascript:')) return;
      if(href && href.startsWith('#')){
        e.preventDefault();
        navigate(a.dataset.id || a.dataset.gid);
      } else if(href && !href.startsWith('#')){
        e.preventDefault();
        window.open(href, '_blank');
        if(a.dataset.id) recordRecent(a.dataset.id);
      }
    });
  });
}

function bindCardEvents(){
  document.querySelectorAll('.mod-card[data-id]').forEach(a => {
    a.addEventListener('click', e => {
      const href = a.getAttribute('href');
      if(href && href.startsWith('javascript:')) return;
      if(href && !href.startsWith('#')){
        e.preventDefault();
        window.open(href, '_blank');
        if(a.dataset.id) recordRecent(a.dataset.id);
      } else if(a.dataset.id){
        e.preventDefault();
        navigate(a.dataset.id);
      }
    });
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 1800);
}

document.addEventListener('DOMContentLoaded', () => {
  renderSidebar();
  renderDrawer();
  let r = (location.hash || '').slice(1) || 'home';
  if(!ALL_MODULES.some(m => m.id === r)) r = 'home';
  State.route = r;
  renderContent();

  document.getElementById('sidebarToggle').addEventListener('click', toggleSidebarMini);
  document.getElementById('menuBtn').addEventListener('click', openDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerMask').addEventListener('click', closeDrawer);
  if(location.search.indexOf('drawer=open') >= 0) setTimeout(openDrawer, 50);

  const onSearch = (e) => {
    State.searchQ = e.target.value;
    renderSidebar();
    renderDrawer();
  };
  document.getElementById('searchInput').addEventListener('input', onSearch);
  document.getElementById('drawerSearch').addEventListener('input', onSearch);

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeDrawer();
  });

  window.addEventListener('hashchange', () => {
    const h = (location.hash || '').slice(1);
    if(h && ALL_MODULES.some(m => m.id === h) && h !== State.route){
      State.route = h;
      renderSidebar();
      renderDrawer();
      renderContent();
    }
  });
});
