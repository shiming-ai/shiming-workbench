<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0b0f">
<title>Crazy Friday · 扫码了解</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #0a0b0f; --card: #13151c; --border: #1f2230;
    --text: #e4e6ed; --text-dim: #8b8f9e; --text-mute: #5a5e6e;
    --orange: #FF6B1A; --yellow: #FFD93D; --green: #00D9A3;
    --purple: #A66BFF;
}
body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    overflow-y: auto;
}
.card {
    width: 100%; max-width: 380px; margin: 20px;
    background: linear-gradient(180deg, var(--card), #0d0e14);
    border-radius: 28px; padding: 40px 32px;
    border: 1px solid var(--border);
    text-align: center; position: relative; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, var(--orange), var(--yellow), var(--orange));
}
.card::after {
    content: ''; position: absolute; top: -100px; left: 50%;
    transform: translateX(-50%);
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(255,107,26,0.08), transparent 70%);
    pointer-events: none;
}
.logo {
    width: 56px; height: 56px; border-radius: 50%;
    background: #000; border: 2px solid rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; position: relative;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.08);
}
.logo::after {
    content: ''; position: absolute; bottom: 6px; right: 6px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--orange); border: 2px solid #000;
}
.logo-text { font-size: 18px; color: #fff; font-weight: 900; }
.logo-text .dot { color: var(--orange); }
.brand {
    font-size: 20px; font-weight: 900; margin-bottom: 4px;
    background: linear-gradient(135deg, #fff 60%, var(--orange));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand-cn {
    font-size: 13px; color: var(--text-mute); margin-bottom: 20px;
    letter-spacing: 2px;
}
.slogan {
    font-size: 22px; font-weight: 900; line-height: 1.3;
    margin-bottom: 6px;
}
.slogan .gradient {
    background: linear-gradient(135deg, var(--orange), var(--yellow));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.slogan-sub {
    font-size: 14px; color: var(--text-dim); margin-bottom: 28px;
}
.qr-wrap {
    display: inline-block; padding: 16px;
    background: #fff; border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 30px rgba(255,107,26,0.15);
}
.qr-wrap img {
    display: block; width: 200px; height: 200px;
}
.scan-tip {
    font-size: 15px; font-weight: 700; color: var(--text);
    margin-bottom: 6px;
}
.scan-sub {
    font-size: 12px; color: var(--text-mute);
}
.quick-links {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-top: 20px;
}
.quick-link {
    background: var(--card2, #1a1d27); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 6px; text-align: center;
    text-decoration: none; color: var(--text-dim);
    font-size: 11px; font-weight: 600;
    transition: all 0.15s;
}
.quick-link:active { border-color: var(--orange); transform: scale(0.96); }
.quick-link-icon { font-size: 20px; margin-bottom: 4px; }
.tags {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin-top: 24px; padding-top: 24px;
    border-top: 1px solid var(--border);
}
.tag {
    font-size: 11px; padding: 5px 12px;
    background: var(--card2, #1a1d27); border-radius: 20px;
    border: 1px solid var(--border); color: var(--text-dim);
}
.footer {
    font-size: 10px; color: var(--text-mute);
    margin-top: 20px;
}
</style>
</head>
<body>

<div class="card">
    <div class="logo">
        <span class="logo-text">CF<span class="dot">.</span></span>
    </div>
    <div class="brand">Crazy Friday</div>
    <div class="brand-cn">疯狂星期五</div>

    <div class="slogan">
        一个人 + AI<br>
        <span class="gradient">= 一家公司</span>
    </div>
    <div class="slogan-sub">用AI帮人赚钱 · 7条业务线真实跑通</div>

    <div class="qr-wrap">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://shiming-ai.github.io/shiming-workbench/hub.html&color=0a0b0f&bgcolor=ffffff&margin=0" alt="扫码进入" />
    </div>

    <div class="scan-tip">📱 扫一扫</div>
    <div class="scan-sub">了解 AI 一人公司 · 3秒看懂</div>

    <div class="quick-links">
        <a href="hub.html" class="quick-link">
            <div class="quick-link-icon">🌐</div>
            <div>入口页</div>
        </a>
        <a href="landing.html" class="quick-link">
            <div class="quick-link-icon">🛠️</div>
            <div>定制服务</div>
        </a>
        <a href="partner.html" class="quick-link">
            <div class="quick-link-icon">🤝</div>
            <div>共创伙伴</div>
        </a>
    </div>

    <div class="tags">
        <span class="tag">AI工作台</span>
        <span class="tag">AI定制开发</span>
        <span class="tag">AI营课程</span>
        <span class="tag">共创伙伴</span>
    </div>

    <div class="footer">© 2026 Crazy Friday 疯狂星期五 · AI × CREATOR</div>
</div>

</body>
</html>
