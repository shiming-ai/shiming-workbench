<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0F19">
<meta name="description" content="时铭 · 个人+工作+家庭财务规划工作台 · 现金流安全 / 清债 / 存钱 / 建家庭资产">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="zh-CN">
<title>时铭财务工作台 · 现金流安全 · 清债 · 存钱 · 建资产</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0B0F19;--bg2:#0E1422;--card:#131A2A;--card2:#182036;--card3:#1D2740;
  --ink:#E8ECF4;--ink2:#9AA6BD;--ink3:#5C6A85;--ink4:#3A4663;
  --line:rgba(120,140,180,.14);--line2:rgba(120,140,180,.28);
  --blue:#4C9AFF;--blue-soft:rgba(76,154,255,.12);
  --gold:#E8B33B;--gold-soft:rgba(232,179,59,.12);
  --red:#F0454E;--red-soft:rgba(240,69,78,.12);
  --green:#2FD573;--green-soft:rgba(47,213,115,.12);
  --yellow:#FFC53D;--yellow-soft:rgba(255,197,61,.12);
  --purple:#8B7CF6;--purple-soft:rgba(139,124,246,.12);
  --grad:linear-gradient(135deg,#4C9AFF,#8B7CF6);
  --grad-gold:linear-gradient(135deg,#F5D06E,#E8B33B);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-md:0 2px 8px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.4);
  --radius:16px;--radius-lg:20px;
  --sidebar-w:240px;
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
}
html,body{background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 420px at 85% -10%,rgba(76,154,255,.08),transparent 60%),
  radial-gradient(700px 380px at -10% 20%,rgba(139,124,246,.06),transparent 60%),
  radial-gradient(600px 300px at 60% 110%,rgba(232,179,59,.04),transparent 60%)}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input,select,textarea{font-family:inherit;border:none;outline:none;background:none;color:var(--ink);font-size:15px}
a{color:var(--blue);text-decoration:none}
h1,h2,h3,h4{font-weight:800;letter-spacing:-.02em}
.num{font-family:Georgia,"Times New Roman",serif;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--ink4);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 布局 ===== */
.layout{display:flex;min-height:100vh}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);z-index:50;
  background:rgba(13,18,30,.92);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding-top:var(--safe-t);
  transition:transform .3s ease;
}
.sidebar-head{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.sb-brand{display:flex;align-items:center;gap:11px}
.sb-logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 6px 18px rgba(76,154,255,.35);flex-shrink:0}
.sb-name{flex:1;min-width:0}
.sb-name .b1{font-family:Georgia,serif;font-size:15px;font-weight:900;letter-spacing:.2px;line-height:1.15}
.sb-name .b2{font-size:10px;color:var(--ink3);margin-top:2px;letter-spacing:.4px}
.sb-sub{display:flex;align-items:center;gap:8px;margin-top:13px;padding:9px 11px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:10.5px;color:var(--ink2)}
.sb-sub .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(47,213,115,.6);flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.sb-sub .n{flex:1;font-weight:600}
.sb-sub .t{color:var(--gold);font-weight:800}
.sidebar-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 16px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;cursor:pointer;
  color:var(--ink2);font-size:13px;font-weight:600;margin-bottom:3px;
  transition:all .15s;text-decoration:none;position:relative;
}
.nav-item:hover{background:var(--card);color:var(--ink);transform:translateX(2px)}
.nav-item:active{transform:scale(.98)}
.nav-item.active{background:linear-gradient(90deg,var(--blue-soft),transparent);color:var(--blue);font-weight:800;box-shadow:inset 2px 0 0 var(--blue)}
.nav-item .ic{width:30px;height:30px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;border:1px solid var(--line)}
.nav-item.active .ic{background:var(--blue-soft);border-color:rgba(76,154,255,.3)}
.nav-item .nm{flex:1}
.nav-item .bdg{font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;background:var(--red-soft);color:var(--red)}
.sidebar-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:9.5px;color:var(--ink3);line-height:1.8;background:rgba(13,18,30,.5)}
.sidebar-foot b{color:var(--gold);font-weight:700}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0;padding:26px 30px 60px;position:relative;z-index:1}
.content{max-width:960px;margin:0 auto}

/* ===== 顶部 ===== */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.tb-title{flex:1;min-width:0}
.tb-title .t1{font-size:21px;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.tb-title .t2{font-size:11.5px;color:var(--ink3);margin-top:3px;letter-spacing:.3px}
.tb-date{font-size:11px;color:var(--ink2);background:var(--card);border:1px solid var(--line);padding:8px 13px;border-radius:11px;font-weight:600;flex-shrink:0}
.tb-menu{display:none;width:40px;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--line);align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.mask{position:fixed;inset:0;background:rgba(5,8,15,.6);z-index:199;opacity:0;pointer-events:none;transition:opacity .3s}
.mask.open{opacity:1;pointer-events:auto}

/* ===== 卡片 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;position:relative;overflow:hidden}
.card.hl{border-color:rgba(76,154,255,.25);background:linear-gradient(160deg,var(--card),rgba(76,154,255,.05))}
.card.gold{border-color:rgba(232,179,59,.25);background:linear-gradient(160deg,var(--card),rgba(232,179,59,.05))}
.card.red{border-color:rgba(240,69,78,.3);background:linear-gradient(160deg,var(--card),rgba(240,69,78,.06))}
.card.green{border-color:rgba(47,213,115,.25);background:linear-gradient(160deg,var(--card),rgba(47,213,115,.05))}
.sec{margin-bottom:20px}
.sec-hd{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.sec-hd h2{font-size:15.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.sec-hd h2::before{content:'';width:3px;height:14px;background:var(--grad);border-radius:2px}
.sec-hd .more{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:600;cursor:pointer;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card2);transition:all .15s}
.sec-hd .more:hover{color:var(--blue);border-color:rgba(76,154,255,.4)}

.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}

/* ===== 首页大数字 ===== */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 16px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow);
  transition:all .18s cubic-bezier(.22,.61,.36,1);cursor:default;
}
.kpi:hover{transform:translateY(-2px)}
.kpi::before{content:'';position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,var(--kpc,rgba(76,154,255,.08)),transparent 70%)}
.kpi .k-l{font-size:10.5px;color:var(--ink3);font-weight:700;letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.kpi .k-v{font-size:29px;font-weight:900;margin-top:7px;line-height:1;color:var(--kc,var(--ink));font-family:Georgia,serif;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.kpi .k-v small{font-size:14px;font-weight:800}
.kpi .k-d{font-size:10px;color:var(--ink3);margin-top:7px;line-height:1.5}
.kpi .k-badge{position:absolute;top:12px;right:12px;font-size:9px;font-weight:800;padding:3px 8px;border-radius:8px;letter-spacing:.3px}

/* ===== 标语 ===== */
.motto{
  background:linear-gradient(135deg,rgba(76,154,255,.1),rgba(232,179,59,.07));
  border:1px solid rgba(76,154,255,.18);border-radius:var(--radius-lg);
  padding:20px 22px;margin-bottom:20px;position:relative;overflow:hidden;
}
.motto .q{font-size:16.5px;font-weight:900;letter-spacing:-.2px;line-height:1.5}
.motto .q b{background:var(--grad-gold);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.motto .flow{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap;font-size:11px;color:var(--ink2);font-weight:600}
.motto .flow .st{background:var(--card2);border:1px solid var(--line);padding:4px 10px;border-radius:8px;white-space:nowrap}
.motto .flow .ar{color:var(--ink4)}
.motto .goal{margin-top:12px;font-size:11px;color:var(--ink2);line-height:1.7}
.motto .goal b{color:var(--gold)}

/* ===== 资金池 ===== */
.pool-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.pool{
  border-radius:var(--radius);padding:16px 17px;position:relative;overflow:hidden;
  border:1px solid;box-shadow:var(--shadow);transition:all .18s;
}
.pool:hover{transform:translateY(-2px)}
.pool.lock{background:linear-gradient(160deg,#182036,#1A1F3D);border-color:rgba(232,179,59,.25)}
.pool.work{background:linear-gradient(160deg,#182036,#14253C);border-color:rgba(76,154,255,.25)}
.pool.free{background:linear-gradient(160deg,#182036,#133427);border-color:rgba(47,213,115,.25)}
.pool .p-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:9px}
.pool.lock .p-ic{background:var(--gold-soft)}
.pool.work .p-ic{background:var(--blue-soft)}
.pool.free .p-ic{background:var(--green-soft)}
.pool .p-n{font-size:12px;font-weight:700;color:var(--ink2)}
.pool .p-v{font-size:26px;font-weight:900;margin-top:5px;font-family:Georgia,serif;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.pool.lock .p-v{color:var(--gold)}
.pool.work .p-v{color:var(--blue)}
.pool.free .p-v{color:var(--green)}
.pool .p-d{font-size:10px;color:var(--ink3);margin-top:6px;line-height:1.5}

/* ===== 倒计时 / 缺口 ===== */
.gap-card{
  display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,rgba(240,69,78,.14),rgba(240,69,78,.04));
  border:1px solid rgba(240,69,78,.3);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:20px;
  position:relative;overflow:hidden;
}
.gap-card::before{content:'';position:absolute;top:-50px;right:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(240,69,78,.15),transparent 70%)}
.gap-card .g-t{flex:1;min-width:0}
.gap-card .g-l{font-size:11px;color:var(--ink2);font-weight:700;letter-spacing:1px}
.gap-card .g-v{font-size:34px;font-weight:900;color:var(--red);font-family:Georgia,serif;letter-spacing:-1.5px;margin-top:3px;line-height:1}
.gap-card .g-d{font-size:11px;color:var(--ink3);margin-top:7px;line-height:1.6}
.gap-card .g-right{flex-shrink:0;text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.gap-card .g-box{background:rgba(0,0,0,.25);border:1px solid rgba(240,69,78,.25);border-radius:13px;padding:10px 14px;text-align:center}
.gap-card .g-box .v{font-size:19px;font-weight:900;color:var(--ink)}
.gap-card .g-box .l{font-size:9.5px;color:var(--ink3);margin-top:1px}
.gap-card .g-box.warn{border-color:rgba(255,197,61,.35)}
.gap-card .g-box.warn .v{color:var(--yellow)}

/* ===== 挑战条 ===== */
.challenge{
  background:linear-gradient(135deg,rgba(139,124,246,.16),rgba(76,154,255,.08));
  border:1px solid rgba(139,124,246,.3);border-radius:var(--radius-lg);
  padding:18px 22px;margin-bottom:20px;position:relative;overflow:hidden;
}
.challenge .c-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.challenge .c-name{font-size:15px;font-weight:900;letter-spacing:.3px}
.challenge .c-name b{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.challenge .c-tag{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:8px;background:var(--purple-soft);color:var(--purple);border:1px solid rgba(139,124,246,.3)}
.challenge .c-remain{margin-left:auto;font-size:11px;color:var(--ink2);font-weight:700}
.challenge .c-remain b{color:var(--yellow);font-size:15px}
.challenge .bar{height:10px;border-radius:6px;background:rgba(0,0,0,.35);margin-top:13px;overflow:hidden;border:1px solid rgba(139,124,246,.15)}
.challenge .bar i{display:block;height:100%;border-radius:6px;background:var(--grad);transition:width .5s cubic-bezier(.22,.61,.36,1)}
.challenge .c-items{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}
.challenge .c-it{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:11px;padding:9px 11px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .15s}
.challenge .c-it:hover{border-color:rgba(139,124,246,.4)}
.challenge .c-it:active{transform:scale(.97)}
.challenge .c-it .ck{width:20px;height:20px;border-radius:7px;border:1.5px solid var(--ink4);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;color:transparent}
.challenge .c-it.done .ck{background:var(--green);border-color:var(--green);color:#0B0F19}
.challenge .c-it .ci{flex:1;min-width:0}
.challenge .c-it .ci .a{font-size:11px;font-weight:700}
.challenge .c-it .ci .b{font-size:9.5px;color:var(--ink3);margin-top:1px}
.challenge .c-it .am{font-size:13px;font-weight:900;color:var(--ink);font-family:Georgia,serif}
.challenge .c-it.done .a,.challenge .c-it.done .am{color:var(--ink4);text-decoration:line-through}

/* ===== 债务 ===== */
.debt-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.ds{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.ds .l{font-size:10px;color:var(--ink3);font-weight:700;letter-spacing:.5px}
.ds .v{font-size:24px;font-weight:900;margin-top:6px;font-family:Georgia,serif;letter-spacing:-1px;line-height:1}
.ds .d{font-size:9.5px;color:var(--ink3);margin-top:5px}
.ds.red .v{color:var(--red)}.ds.gold .v{color:var(--gold)}.ds.green .v{color:var(--green)}.ds.blue .v{color:var(--blue)}
.debt-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.debt-table th{font-size:10px;color:var(--ink3);font-weight:800;letter-spacing:.5px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.debt-table td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.debt-table tr:last-child td{border-bottom:none}
.debt-table tr.risk-S{background:rgba(240,69,78,.07)}
.debt-table tr.risk-S td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.debt-table tr.risk-A{background:rgba(232,179,59,.04)}
.debt-table tr.risk-A td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.debt-table tr.risk-B td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.debt-table tr.risk-C td:first-child{box-shadow:inset 3px 0 0 var(--ink4)}
.debt-table .dn{font-weight:800;font-size:12.5px}
.debt-table .dc{font-size:10px;color:var(--ink3);margin-top:2px}
.debt-table .bal{font-weight:900;font-size:13.5px;font-family:Georgia,serif}
.debt-table .tag{display:inline-block;font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:7px;margin-right:4px;white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.yellow{background:var(--yellow-soft);color:var(--yellow)}
.tag.gray{background:rgba(120,140,180,.12);color:var(--ink3)}
.debt-edit{width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:11px;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;margin-left:4px}
.debt-edit:hover{color:var(--blue);border-color:rgba(76,154,255,.4)}
.pay-btn{font-size:10.5px;font-weight:800;padding:5px 11px;border-radius:9px;background:var(--green-soft);color:var(--green);border:1px solid rgba(47,213,115,.3);cursor:pointer;transition:all .15s;white-space:nowrap}
.pay-btn:hover{background:var(--green);color:#0B0F19}
.pay-btn:active{transform:scale(.95)}

/* ===== 分配器 ===== */
.allo-form{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.allo-form .inp{
  background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:11px 15px;
  font-size:20px;font-weight:800;font-family:Georgia,serif;width:170px;color:var(--gold);
}
.allo-form .inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.allo-btn{background:var(--grad-gold);color:#201A08;font-size:13px;font-weight:900;padding:11px 22px;border-radius:12px;box-shadow:0 4px 14px rgba(232,179,59,.3);transition:all .15s}
.allo-btn:hover{transform:translateY(-1px)}
.allo-btn:active{transform:scale(.96)}
.allo-out{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ao{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;position:relative}
.ao .l{font-size:10px;color:var(--ink3);font-weight:700;letter-spacing:.4px}
.ao .v{font-size:19px;font-weight:900;margin-top:5px;font-family:Georgia,serif;letter-spacing:-.5px}
.ao .v.red{color:var(--red)}.ao .v.gold{color:var(--gold)}.ao .v.green{color:var(--green)}.ao .v.blue{color:var(--blue)}.ao .v.purple{color:var(--purple)}
.ao .d{font-size:9.5px;color:var(--ink3);margin-top:4px;line-height:1.5}

/* ===== 收入档位 ===== */
.tier-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.tier{border-radius:var(--radius);padding:17px 18px;border:1px solid;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tier .t-ic{font-size:21px}
.tier .t-n{font-size:13px;font-weight:900;margin-top:7px}
.tier .t-v{font-size:24px;font-weight:900;margin-top:3px;font-family:Georgia,serif;letter-spacing:-.5px}
.tier .t-d{font-size:10.5px;color:var(--ink3);margin-top:6px;line-height:1.6}
.tier.guard{background:linear-gradient(160deg,#1D2736,#182036);border-color:rgba(255,197,61,.3)}.tier.guard .t-v{color:var(--yellow)}
.tier.normal{background:linear-gradient(160deg,#16301F,#182036);border-color:rgba(47,213,115,.3)}.tier.normal .t-v{color:var(--green)}
.tier.sprint{background:linear-gradient(160deg,#33201A,#182036);border-color:rgba(240,69,78,.35)}.tier.sprint .t-v{color:var(--red)}

function fmt(n){

  return '¥' + Number(n).toLocaleString('zh-CN', {maximumFractionDigits:0});

function fmtN(n){

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============================================================
   计算引擎
============================================================ */
const todayStr = (()=>{ const t=new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); })();
const thisMonth = (()=>{ const t=new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'); })();
const today = new Date();
const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
const daysLeftInMonth = daysInMonth - today.getDate();
// 距下月初天数（用于"下一月预算缺口分摊"）
const nextMonthStart = new Date(today.getFullYear(), today.getMonth()+1, 1);
const daysToNextMonth = Math.max(1, Math.ceil((nextMonthStart - today)/86400000));

function calc(){
  const debts = DB.debts.filter(d => d.balance > 0);
  const totalDebt = DB.debts.reduce((s,d)=>s+d.balance,0);
  const totalPaid = DB.debts.reduce((s,d)=>s+d.paid,0);
  const monthPaid = DB.debts.reduce((s,d)=>s+d.monthPaid,0);
  const monthPlan = DB.debts.reduce((s,d)=>s+d.monthPlan,0);
  const sDebt = DB.debts.filter(d=>d.risk==='S').reduce((s,d)=>s+d.balance,0);
  const aDebt = DB.debts.filter(d=>d.risk==='A').reduce((s,d)=>s+d.balance,0);

  // 8月底回款分配
  const allotTotal = DB.allotment.items.reduce((s,i)=>s+i.amount,0);
  const lockedTotal = DB.allotment.items.filter(i=>i.locked).reduce((s,i)=>s+i.amount,0);
  const workAllot = DB.allotment.items.filter(i=>!i.locked).reduce((s,i)=>s+i.amount,0);
  const allotRemain = (DB.allotment.amount||0) - allotTotal;

  // 本月支出（当月清单，可配置）
  const monthExpTotal = DB.monthExp.reduce((s,e)=>s+e.amount,0);
  const monthFixed = DB.monthExp.filter(e=>e.type!=='可延迟').reduce((s,e)=>s+e.amount,0);
  const monthDefer = DB.monthExp.filter(e=>e.type==='可延迟').reduce((s,e)=>s+e.amount,0);

  // 本月收入
  const arrived = DB.income.arrived||0;
  const pending = DB.income.pending||0;
  const expected = DB.income.expected||0;

  // 必须还款（S+A+B 硬性承诺；C级亲友无息可延后）
  const mustPay = DB.debts.filter(d=>d.risk!=='C'&&d.balance>0).reduce((s,d)=>s+d.monthPlan,0);
  const deferPay = DB.debts.filter(d=>d.risk==='C'&&d.balance>0).reduce((s,d)=>s+d.monthPlan,0);

  // 本月资金需求 = 固定支出 + 当月必须还款
  const monthNeed = monthFixed + mustPay;

  // 缺口 = 需求 - 已到账（缺口 = "还需要额外赚多少"才到 9 月初够覆盖 9 月预算）
  const shortfall = Math.max(0, monthNeed - arrived);

  // 真正可周转 = 已到账 - 锁定 - 固定支出（不含必须还款？可周转按用户公式：已到账-锁定-近期必须付款）
  const cashLocked = lockedTotal;   // 已锁定
  const rotatable = Math.max(0, arrived - cashLocked - monthNeed);

  // 最近付款日
  const payDates = [];
  DB.monthExp.forEach(e=>{ if(e.date && e.date >= todayStr) payDates.push({date:e.date, name:e.name, amount:e.amount, defer:e.type==='可延迟'}); });
  DB.debts.forEach(d=>{ if(d.dueDate && d.dueDate >= todayStr && d.balance>0) payDates.push({date:d.dueDate, name:d.name, amount:d.balance, defer:false}); });
  payDates.sort((a,b)=>a.date<b.date?-1:1);
  const nextPay = payDates[0] || null;
  const nextPayDays = nextPay ? Math.max(0, Math.ceil((new Date(nextPay.date) - today)/86400000)) : 0;

  // 日均需赚：把"下一月预算缺口"分摊到"距下月初的剩余天数"
  const dailyNeed = daysToNextMonth > 0 ? Math.ceil(shortfall / daysToNextMonth) : 0;

  // 8天挑战（含当天自然日：8/22 → 8/29 共 8 天）
  const ch = DB.challenge;
  const chDone = ch.items.filter(i=>i.done).reduce((s,i)=>s+i.amount,0);
  const chRemain = Math.max(0, ch.target - chDone);
  const chDays = Math.max(1, Math.ceil((new Date(ch.end) - today)/86400000) + 1);
  const chDaily = chDays > 0 ? Math.ceil(chRemain/chDays) : 0;

  // 资产塔
  const tower = DB.tower.map(g=>{
    const stage = g.stage || [g.target];
    let curStage = 0, curTarget = stage[0];
    for(const st of stage){ if(g.saved >= st){ curStage++; curTarget = st; } else break; }
    const nextTarget = curStage < stage.length ? stage[curStage] : null;
    const stageIdx = Math.min(curStage, stage.length-1);
    const pct = Math.min(100, Math.round(g.saved/(g.target||1)*100));
    const stagePct = Math.min(100, Math.round(g.saved/(nextTarget||g.target)*100));
    return { ...g, curTarget, nextTarget, stageIdx, pct, stagePct, done: g.saved >= g.target };
  });
  const towerTotal = DB.tower.reduce((s,g)=>s+g.target,0);
  const towerSaved = DB.tower.reduce((s,g)=>s+g.saved,0);

  // 分配器结果（输入本月实际收入）：先生存 → 再还债 → 先锁个人最低储蓄 → 剩余按比例
  function allocate(income){
    const s = DB.settings;
    const living = s.baseLivingMin;
    const debt = mustPay;
    const out = { income, living, debt, personal:0, work:0, family:0, free:0, gap:0, personalLocked:0 };
    if(income <= 0){ return out; }
    const remain = income - living - debt;
    if(remain < 0){ out.gap = -remain; return out; }
    // 先锁个人最低储蓄（先锁后花）
    const personalLocked = Math.min(remain, s.personalSaveMin);
    out.personalLocked = personalLocked;
    const rest = remain - personalLocked;
    const alloc = s.allocAfterDebt;
    out.family = Math.round(rest * alloc.family/100);
    out.work = Math.round(rest * alloc.work/100);
    out.personal = personalLocked + Math.round(rest * alloc.personal/100);
    out.free = Math.max(0, rest - out.family - out.work - Math.round(rest*alloc.personal/100));
    return out;
  }

  return {
    debts, totalDebt, totalPaid, monthPaid, monthPlan, sDebt, aDebt,
    allotTotal, lockedTotal, workAllot, allotRemain,
    monthExpTotal, monthFixed, monthDefer,
    arrived, pending, expected,
    mustPay, deferPay, monthNeed, shortfall, cashLocked, rotatable,
    nextPay, nextPayDays, dailyNeed,
    ch, chDone, chRemain, chDays, chDaily,
    tower, towerTotal, towerSaved,
    allocate,
    refDiff: totalDebt - (DB.meta.refTotal||0)
  };
}

  const yearPaid = DB.debts.reduce((s,d)=>s+(d.yearPaid||0),0);
  const origTotal = DB.debts.reduce((s,d)=>s+d.original,0);
  const downPct = origTotal>0 ? Math.round((c.totalPaid/origTotal)*100) : 0;
  const refDiff = c.refDiff;
  // 女朋友单笔进度
  const gf = DB.debts.find(d=>d.id==='gf') || {balance:0,paid:0,original:0,monthPlan:0,monthPaid:0};
  const gfBal = gf.balance||0, gfPaid = gf.paid||0, gfPct = (gf.original||0)>0 ? Math.round(gfPaid/(gf.original||1)*100) : 0;
  const gfPlan = gf.monthPlan||0, gfMpd = gf.monthPaid||0;
  const gfMonths = gfPlan>0 && gfBal>0 ? Math.ceil(gfBal/gfPlan) : 0;

  const sorted = [...DB.debts].sort((a,b)=>{
    const rk = {S:0,A:1,B:2,C:3};
    if(rk[a.risk]!==rk[b.risk]) return rk[a.risk]-rk[b.risk];
    return (a.priority||9)-(b.priority||9);
  });

  const rows = sorted.map(d => {
    const riskTag = {S:'<span class="tag red">S · 纠纷/法律</span>', A:'<span class="tag gold">A · 长期计划</span>', B:'<span class="tag blue">B · 有息/固定</span>', C:'<span class="tag gray">C · 亲友无息</span>'}[d.risk]||'';
    const disputeTag = d.dispute ? '<span class="tag red">⚖️ 有纠纷</span>' : '';
    const sueTag = d.sue ? '<span class="tag red">可能起诉</span>' : '';
    const payDone = d.balance<=0;
    const monthOK = d.monthPlan>0 && d.monthPaid>=d.monthPlan;
    const paidPct = d.original>0 ? Math.round(d.paid/d.original*100) : 0;
    return `
      <tr class="risk-${d.risk} ${payDone?'done-row':''}">
        <td>
          <div class="dn">${esc(d.name)} ${payDone?'<span class="tag green">已还清</span>':''}</div>
          <div class="dc">${esc(d.creditor||'')}</div>
          ${d.interest?'<span class="tag yellow">有息</span>':''}${disputeTag}${sueTag}
        </td>
        <td class="bal" style="color:${d.risk==='S'?'var(--red)':d.risk==='A'?'var(--gold)':'var(--ink)'}">${fmtN(d.balance)}</td>
        <td>
          <div class="num" style="font-weight:800">${fmtN(d.original)}</div>
          <div style="font-size:9.5px;color:var(--green);margin-top:2px">已还 ${fmtN(d.paid)} · ${paidPct}%</div>
        </td>
        <td>
          ${d.monthPlan>0
            ? `<div style="font-size:11px;font-weight:700">${fmtN(d.monthPaid)} <span style="color:var(--ink3)">/ ${fmtN(d.monthPlan)}</span></div>
               ${monthOK?'<div style="font-size:9.5px;color:var(--green);font-weight:800;margin-top:2px">✅ 本月已达标</div>':'<div style="font-size:9.5px;color:var(--yellow);font-weight:800;margin-top:2px">还差 '+fmtN(Math.max(0,d.monthPlan-d.monthPaid))+'</div>'}`
            : `<div style="color:var(--ink3);font-size:10.5px">无固定计划</div>`}
        </td>
        <td>
          ${d.balance>0
            ? `<button class="pay-btn" onclick="payDebt('${d.id}')">+ 还款</button>
               <button class="debt-edit" onclick="editDebt('${d.id}')" title="修改">✎</button>`
            : `<button class="debt-edit" onclick="editDebt('${d.id}')" title="修改">✎</button>`}
        </td>
        <td style="font-size:10.5px;color:var(--ink3);max-width:170px">
          <div style="white-space:normal;line-height:1.5">${esc(d.note||'')}</div>
          ${d.clearDate?`<div style="color:var(--gold);font-weight:700;margin-top:3px">预计清零：${d.clearDate}</div>`:''}
        </td>
      </tr>`;
  }).join('');

  return `
    <div class="debt-sum fade-in">
      <div class="ds red"><div class="l">总负债（自动汇总）</div><div class="v num">${fmtN(c.totalDebt)}</div><div class="d">参考盘 ${fmtN(DB.meta.refTotal||0)} ${refDiff!==0?`· 差 ${fmtN(Math.abs(refDiff))} 待核对`:''}</div></div>
      <div class="ds gold"><div class="l">本月已还</div><div class="v num">${fmtN(c.monthPaid)}</div><div class="d">本月计划 ${fmtN(c.monthPlan)}</div></div>
      <div class="ds blue"><div class="l">年度已还</div><div class="v num">${fmtN(yearPaid)}</div><div class="d">2026 年累计</div></div>
      <div class="ds green"><div class="l">总债务下降</div><div class="v num">${downPct}%</div><div class="d">原始 ${fmtN(origTotal)} → 当前 ${fmtN(c.totalDebt)}</div></div>
    </div>

    <div class="sec fade-in">
      <div class="sec-hd"><h2>📋 全部债务（S→A→B→C 自动排序）</h2><span class="more" onclick="addDebt()">+ 新增债务</span></div>
      <div class="card" style="padding:6px 12px 10px;overflow-x:auto">
        <table class="debt-table">
          <thead><tr>
            <th>债务 / 债权人</th><th>当前余额</th><th>原始 / 已还</th><th>本月 实际/计划</th><th>操作</th><th>备注</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="font-size:10px;color:var(--ink3);margin-top:10px;line-height:1.7">
        🔴 S级 = 即将逾期 / 法律 / 客户纠纷（优先级最高） · 🟡 A级 = 女朋友 / 杭州 长期计划 · 🔵 B级 = 信用卡/网贷 有息 · ⚪ C级 = 亲友无息可延后
      </div>
    </div>

    <div class="card red fade-in">
      <div style="font-size:13px;font-weight:900">🔔 女朋友约定 · 还完再领证</div>
      <div style="font-size:11px;color:var(--ink2);margin-top:5px;line-height:1.8">
        欠款 <b class="num" style="color:var(--gold)">50,000</b> · 已还 <b class="num" style="color:var(--green)">${fmtN(gfPaid)}</b> · 当前余额 <b class="num" style="color:var(--red)">${fmtN(gfBal)}</b> · 进度 <b style="color:var(--gold)">${gfPct}%</b><br>
        本月计划 ${fmtN(gfPlan)} · 本月已还 ${fmtN(gfMpd)} · 按当前速度约 <b class="num" style="color:var(--gold)">${gfMonths} 个月</b>后清零，进入领证倒计时。<br>
        <span style="color:var(--ink3)">短期每月 2,000-5,000 起步 · 收入好的月份允许额外大额还款</span>
      </div>
    </div>
  `;
}

function estimateClear(){
  // 女朋友50000，按3000/月 → 约17个月；简单估算
  const gf = DB.debts.find(d=>d.id==='gf');
  if(!gf || gf.balance<=0) return '0';
  const rate = gf.monthPlan>0 ? gf.monthPlan : 3000;
  return Math.ceil(gf.balance / rate);
}

function payDebt(id){
  const d = DB.debts.find(x=>x.id===id);
  if(!d) return;
  openModal(`
    <div class="modal-hd"><div class="t">💳 还款 · ${esc(d.name)}</div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="fld"><div class="f-l">当前余额</div><div class="f-i num-inp">${fmt(d.balance)}</div></div>
    <div class="fld"><div class="f-l">本次还款金额</div><input class="f-i num-inp" id="payAmt" type="number" value="${Math.min(d.monthPlan||1000, d.balance)}" min="0" max="${d.balance}"></div>
    <div class="fld"><div class="f-l">备注（可选）</div><input class="f-i" id="payNote" placeholder="转账记录 / 截图已留"></div>
    <button class="mbtn green" onclick="confirmPay('${id}')">确认还款 →</button>
    <button class="mbtn danger" style="margin-top:8px" onclick="payFull('${id}')">💰 一次性还清全部</button>
  `);
}
function confirmPay(id){
  const amt = parseFloat(document.getElementById('payAmt').value)||0;
  const d = DB.debts.find(x=>x.id===id);
  if(!d) return;
  if(amt<=0){ toast('请输入金额'); return; }
  if(amt>d.balance){ toast('超过当前余额'); return; }
  const note = document.getElementById('payNote').value||'';
  d.balance = Math.max(0, d.balance - amt);
  d.paid += amt;
  d.monthPaid += amt;
  d.yearPaid = (d.yearPaid||0) + amt;
  // 记录到当月复盘
  const m = DB.months[thisMonth] || (DB.months[thisMonth] = { income:0, debtPaid:0, personalSave:0, familySave:0, workSave:0, note:[] });
  m.debtPaid += amt;
  if(note) m.note.push((new Date()).toLocaleDateString('zh-CN')+' 还'+d.name+' '+fmt(amt)+' '+note);
  save();
  closeModal();
  toast('✅ 已还款 '+fmt(amt)+' · '+d.name+' 剩 '+fmt(d.balance));
  renderPage();
}
function payFull(id){
  const d = DB.debts.find(x=>x.id===id);
  if(!d) return;
  const amt = d.balance;
  d.balance = 0; d.paid += amt; d.monthPaid += amt;
  d.yearPaid = (d.yearPaid||0)+amt;
  const m = DB.months[thisMonth] || (DB.months[thisMonth]={income:0,debtPaid:0,personalSave:0,familySave:0,workSave:0,note:[]});
  m.debtPaid += amt;
  save(); closeModal();
  toast('🎉 '+d.name+' 已全部还清！');
  renderPage();
}

function saveDebt(id){
  const d = DB.debts.find(x=>x.id===id);
  if(!d) return;
  const bal = parseFloat(document.getElementById('dBal').value)||0;
  const paid = parseFloat(document.getElementById('dPaid').value)||0;
  const monthPlan = parseFloat(document.getElementById('dMP').value)||0;
  const monthPaid = parseFloat(document.getElementById('dMpd').value)||0;
  const dueDate = document.getElementById('dDue').value||'';
  const risk = document.getElementById('dRisk').value;
  d.balance = bal; d.paid = paid; d.monthPlan = monthPlan; d.monthPaid = monthPaid;
  d.dueDate = dueDate; d.risk = risk;
  d.note = document.getElementById('dNote').value||'';
  d.original = parseFloat(document.getElementById('dOri').value)||bal+paid;
  save(); closeModal(); toast('✅ 已保存');
  renderPage();
}
function delDebt(id){
  if(!confirm('确认删除这笔债务？')) return;
  DB.debts = DB.debts.filter(x=>x.id!==id);
  save(); closeModal(); toast('已删除'); renderPage();
}
function addDebt(){
  openModal(`
    <div class="modal-hd"><div class="t">+ 新增债务</div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="fld"><div class="f-l">债务名称</div><input class="f-i" id="nName" placeholder="如：XXX借款"></div>
    <div class="fld"><div class="f-l">债权人</div><input class="f-i" id="nCred" placeholder="如：朋友 / 银行"></div>
    <div class="fld-row">
      <div class="fld"><div class="f-l">当前余额</div><input class="f-i num-inp" id="nBal" type="number" placeholder="0"></div>
      <div class="fld"><div class="f-l">原始金额</div><input class="f-i num-inp" id="nOri" type="number" placeholder="0"></div>
    </div>
    <div class="fld-row">
      <div class="fld"><div class="f-l">风险等级</div><select class="f-i" id="nRisk"><option value="C">C 亲友无息</option><option value="B">B 有息</option><option value="A">A 长期计划</option><option value="S">S 纠纷/法律</option></select></div>
      <div class="fld"><div class="f-l">本月计划</div><input class="f-i num-inp" id="nMP" type="number" placeholder="0"></div>
    </div>
    <div class="fld"><div class="f-l">备注</div><input class="f-i" id="nNote" placeholder="可选"></div>
    <button class="mbtn primary" onclick="createDebt()">创建</button>
  `);
}
function createDebt(){
  const name = document.getElementById('nName').value.trim();
  if(!name){ toast('请输入债务名称'); return; }
  const bal = parseFloat(document.getElementById('nBal').value)||0;
  const ori = parseFloat(document.getElementById('nOri').value)||bal;
  DB.debts.push({
    id:'d'+Date.now(), name, creditor:document.getElementById('nCred').value.trim()||'',
    original:ori, balance:bal, paid:ori-bal, monthPlan:parseFloat(document.getElementById('nMP').value)||0,
    monthPaid:0, dueDate:'', minPay:0, interest:false, dispute:false, sue:false,
    risk:document.getElementById('nRisk').value, priority:9, clearDate:'',
    note:document.getElementById('nNote').value.trim()||''
  });
  save(); closeModal(); toast('✅ 债务已添加'); renderPage();
}

      ${(m.note&&m.note.length)?`<div style="margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-size:11px;color:var(--ink2);line-height:1.9">${m.note.map(n=>'• '+esc(n)).join('<br>')}</div>`:''}
    </div>
  `;
}
function revShift(d){
  const [y,mo] = revMonth.split('-').map(Number);
  const t = new Date(y, mo-1+d, 1);
  revMonth = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');
  renderPage();
}
function editMonthRecord(){
  const m = DB.months[revMonth] || (DB.months[revMonth]={income:0,debtPaid:0,personalSave:0,familySave:0,workSave:0,note:[]});
  openModal(`
    <div class="modal-hd"><div class="t">📝 填写 ${revMonth} 复盘数据</div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="fld"><div class="f-l">本月收入</div><input class="f-i num-inp" id="rIncome" type="number" value="${m.income||0}"></div>
    <div class="fld-row">
      <div class="fld"><div class="f-l">本月还债</div><input class="f-i num-inp" id="rDebt" type="number" value="${m.debtPaid||0}"></div>
      <div class="fld"><div class="f-l">个人存款</div><input class="f-i num-inp" id="rSave" type="number" value="${m.personalSave||0}"></div>
    </div>
    <div class="fld-row">
      <div class="fld"><div class="f-l">家庭存款</div><input class="f-i num-inp" id="rFamily" type="number" value="${m.familySave||0}"></div>
      <div class="fld"><div class="f-l">工作资金新增</div><input class="f-i num-inp" id="rWork" type="number" value="${m.workSave||0}"></div>
    </div>
    <button class="mbtn primary" onclick="saveMonthRecord()">保存</button>
  `);
}
function saveMonthRecord(){
  const m = DB.months[revMonth] || (DB.months[revMonth]={income:0,debtPaid:0,personalSave:0,familySave:0,workSave:0,note:[]});
  m.income = parseFloat(document.getElementById('rIncome').value)||0;
  m.debtPaid = parseFloat(document.getElementById('rDebt').value)||0;
  m.personalSave = parseFloat(document.getElementById('rSave').value)||0;
  m.familySave = parseFloat(document.getElementById('rFamily').value)||0;
  m.workSave = parseFloat(document.getElementById('rWork').value)||0;
  save(); closeModal(); toast('✅ 复盘已保存'); renderPage();
}

/* ============================================================
   设置页
============================================================ */

  const c = calc();
  return `
    <div class="sec">
      <div class="sec-hd"><h2>⚙️ 核心参数</h2></div>
      <div class="card" style="padding:8px 18px">
        <div class="set-row"><div class="s-l"><div class="t">参考总负债盘</div><div class="d">用于与自动汇总对比，提示核对</div></div><div class="s-v num">${fmtN(DB.meta.refTotal||0)}</div><button class="debt-edit" onclick="editRefTotal()">✎</button></div>
        <div class="set-row"><div class="s-l"><div class="t">基本生存盘（月）</div><div class="d">不随收入升级消费</div></div><div class="s-v num">${fmtN(DB.settings.baseLivingMin)} - ${fmtN(DB.settings.baseLivingMax)}</div><button class="debt-edit" onclick="editBaseLiving()">✎</button></div>
        <div class="set-row"><div class="s-l"><div class="t">个人储蓄最低线（月）</div><div class="d">先锁后花，不剩钱再存</div></div><div class="s-v num">${fmtN(DB.settings.personalSaveMin)}</div><button class="debt-edit" onclick="editSaveMin()">✎</button></div>
        <div class="set-row"><div class="s-l"><div class="t">债务清完后分配比例</div><div class="d">家庭共同 / 个人 / 工作应急</div></div><div class="s-v num">${DB.settings.allocAfterDebt.family}% / ${DB.settings.allocAfterDebt.personal}% / ${DB.settings.allocAfterDebt.work}%</div><button class="debt-edit" onclick="editAllocRatio()">✎</button></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>📦 数据管理</h2></div>
      <div class="grid grid-2">
        <div class="card" onclick="exportData()" style="cursor:pointer;text-align:center;padding:22px">
          <div style="font-size:26px">📤</div>
          <div style="font-size:13px;font-weight:900;margin-top:8px">导出备份 JSON</div>
          <div style="font-size:10.5px;color:var(--ink3);margin-top:4px">下载全部数据 · 可安全保存到本地</div>
        </div>
        <div class="card" onclick="document.getElementById('importFile').click()" style="cursor:pointer;text-align:center;padding:22px">
          <div style="font-size:26px">📥</div>
          <div style="font-size:13px;font-weight:900;margin-top:8px">导入备份</div>
          <div style="font-size:10.5px;color:var(--ink3);margin-top:4px">恢复之前导出的 JSON</div>
          <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        </div>
      </div>
      <div class="card red" style="margin-top:12px;text-align:center;cursor:pointer;padding:16px" onclick="resetData()">
        <div style="font-size:12px;font-weight:900;color:var(--red)">⚠️ 恢复出厂数据（清空所有修改）</div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-hd"><h2>ℹ️ 数据口径说明</h2></div>
      <div class="card" style="font-size:11px;color:var(--ink2);line-height:2;padding:16px 18px">
        • 总负债 = 所有有效债务 <b class="num" style="color:var(--ink)">${fmtN(c.totalDebt)}</b> 自动汇总（参考盘 ${fmtN(DB.meta.refTotal||0)}）<br>
        • 分期乐已清零，不参与计算（2026-08 最新口径）<br>
        • 房贷 2,036 / 车贷 1,616（最新口径，覆盖 Excel 旧值）<br>
        • 客户欠款按最新总盘 118,200（明确 103,200 + 模糊 15,000）<br>
        • 数据保存在本机浏览器 localStorage，不联网上传
      </div>
    </div>
  `;
}
function editRefTotal(){
  openModal(`
    <div class="modal-hd"><div class="t">参考总负债盘</div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="fld"><div class="f-l">参考值（元）</div><input class="f-i num-inp" id="rt" type="number" value="${DB.meta.refTotal||367000}"></div>
    <button class="mbtn primary" onclick="saveRefTotal()">保存</button>
  `);
}
function saveRefTotal(){
  DB.meta.refTotal = parseFloat(document.getElementById('rt').value)||0;
  save(); closeModal(); toast('✅ 已保存'); renderPage();
}
function editBaseLiving(){
  openModal(`
    <div class="modal-hd"><div class="t">基本生存盘</div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="fld-row">
      <div class="fld"><div class="f-l">下限</div><input class="f-i num-inp" id="bl1" type="number" value="${DB.settings.baseLivingMin}"></div>
      <div class="fld"><div class="f-l">上限</div><input class="f-i num-inp" id="bl2" type="number" value="${DB.settings.baseLivingMax}"></div>
    </div>
    <button class="mbtn primary" onclick="saveBaseLiving()">保存</button>
  `);
}
function saveBaseLiving(){
  DB.settings.baseLivingMin = parseFloat(document.getElementById('bl1').value)||13000;
  DB.settings.baseLivingMax = parseFloat(document.getElementById('bl2').value)||15000;
  save(); closeModal(); toast('✅ 已保存'); renderPage();
}
function editSaveMin(){
  openModal(`
    <div class="modal-hd"><div class="t">个人储蓄最低线</div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="fld"><div class="f-l">每月最低（元）</div><input class="f-i num-inp" id="sm" type="number" value="${DB.settings.personalSaveMin}"></div>
    <button class="mbtn primary" onclick="saveSaveMin()">保存</button>
  `);
}
function saveSaveMin(){
  DB.settings.personalSaveMin = parseFloat(document.getElementById('sm').value)||3000;
  save(); closeModal(); toast('✅ 已保存'); renderPage();
}
function editAllocRatio(){
  const a = DB.settings.allocAfterDebt;
  openModal(`
    <div class="modal-hd"><div class="t">债务清完后分配比例</div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="fld-row3">
      <div class="fld"><div class="f-l">家庭共同 %</div><input class="f-i num-inp" id="r1" type="number" value="${a.family}"></div>
      <div class="fld"><div class="f-l">个人 %</div><input class="f-i num-inp" id="r2" type="number" value="${a.personal}"></div>
      <div class="fld"><div class="f-l">工作 %</div><input class="f-i num-inp" id="r3" type="number" value="${a.work}"></div>
    </div>
    <button class="mbtn primary" onclick="saveAllocRatio()">保存</button>
  `);
}
function saveAllocRatio(){
  DB.settings.allocAfterDebt.family = parseFloat(document.getElementById('r1').value)||40;
  DB.settings.allocAfterDebt.personal = parseFloat(document.getElementById('r2').value)||30;
  DB.settings.allocAfterDebt.work = parseFloat(document.getElementById('r3').value)||30;
  save(); closeModal(); toast('✅ 已保存'); renderPage();
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'shiming-finance-backup-'+todayStr+'.json';
  a.click();
  toast('📤 已导出备份');
}
function importData(ev){
  const f = ev.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!d.debts || !d.tower) throw new Error('bad');
      DB = d;
      save(); renderNav(); renderPage();
      toast('✅ 备份已导入');
    }catch(e){ toast('❌ 文件格式不对'); }
  };
  rd.readAsText(f);
  ev.target.value = '';
}
function resetData(){
  if(!confirm('确认恢复出厂数据？所有修改将被清空！')) return;
  localStorage.removeItem(LS_KEY);
  DB = defaultData();
  save(); renderNav(); renderPage();
  toast('已恢复出厂数据');
}

/* ============================================================
   初始化
============================================================ */
function bindPage(){
  // 侧栏/遮罩
  document.getElementById('menuBtn').onclick = () => {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('mask').classList.add('open');
  };
  document.getElementById('mask').onclick = () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('mask').classList.remove('open');
  };
  // 模态框背景点击关闭
  document.getElementById('modal').addEventListener('click', e => {
    if(e.target.id === 'modal') closeModal();
  });
  document.getElementById('tbDate').textContent = (new Date()).toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
}

document.addEventListener('DOMContentLoaded', () => {
  renderNav();
  // 首次打开自动分配器（如果有上次收入）
  const h = (location.hash||'').slice(1);
  if(ROUTES.some(r=>r.id===h)) route = h;
  renderPage();
  setTimeout(()=>{ if(route==='allocation' && DB.allocator && DB.allocator.last) runAllocator(); }, 100);
  window.addEventListener('hashchange', () => {
    const h = (location.hash||'').slice(1);
    if(ROUTES.some(r=>r.id===h) && h!==route){ route = h; renderNav(); renderPage(); }
  });
});
</script>
