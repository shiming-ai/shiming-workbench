<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0420">
<title>服务中心 · Crazy Friday</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-tab="discover">

<div class="topbar">
    <div class="brand">
        <div class="brand-icon">CF</div>
        <div>
            <div class="brand-name">服务中心</div>
            <div class="brand-sub">08 · 找靠谱服务商</div>
        </div>
    </div>
    <div class="bell">🔍</div>
</div>

<div class="wrap">
    <div style="padding:16px 18px 12px">
        <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:8px">
            <span style="color:#8d82a8">🔍</span>
            <input placeholder="搜索服务商、服务..." style="flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:13px">
        </div>
    </div>

    <div class="grid" style="padding:0 18px;margin-bottom:16px">
        <div class="grid-card"><div class="em">📦</div><div class="tt">全部</div><div class="td">所有服务</div></div>
        <div class="grid-card"><div class="em">💻</div><div class="tt">应用开发</div><div class="td">定制开发</div></div>
        <div class="grid-card"><div class="em">🎬</div><div class="tt">视频创作</div><div class="td">短视频/漫剧</div></div>
        <div class="grid-card"><div class="em">✍️</div><div class="tt">文案策划</div><div class="td">文案/BP</div></div>
        <div class="grid-card"><div class="em">📣</div><div class="tt">运营推广</div><div class="td">引流/增长</div></div>
        <div class="grid-card"><div class="em">⋯</div><div class="tt">更多</div><div class="td">持续更新</div></div>
    </div>

    <div class="section-head">
        <div class="section-tt">🤝 推荐服务商</div>
        <div class="section-more">查看更多</div>
    </div>
    <div class="section">
        <div class="card">
            <div class="card-head">
                <div class="card-icon" style="background:linear-gradient(135deg,#A855F7,#EC4899)">💡</div>
                <div class="card-name">AI陪跑</div>
                <span class="card-tag">⭐ 4.8</span>
            </div>
            <div class="card-desc">1.2w人使用 · 📚 教学 · ⏰ 8h交付</div>
            <div class="card-meta"><span class="meta-tag">🎯 全程陪跑</span><span class="meta-tag">💎 VIP专属</span></div>
        </div>
        <div class="card">
            <div class="card-head">
                <div class="card-icon" style="background:linear-gradient(135deg,#3b82f6,#22d3ee)">📐</div>
                <div class="card-name">星图AI工作室</div>
                <span class="card-tag">⭐ 4.9</span>
            </div>
            <div class="card-desc">8.7w人 · 🕐 32小时 · 👥 6个团队</div>
            <div class="card-meta"><span class="meta-tag">💼 企业级</span><span class="meta-tag">🏆 金牌服务商</span></div>
        </div>
        <div class="card">
            <div class="card-head">
                <div class="card-icon" style="background:linear-gradient(135deg,#10b981,#34D399)">⚙️</div>
                <div class="card-name">青松AI开发</div>
                <span class="card-tag">⭐ 4.7</span>
            </div>
            <div class="card-desc">3.5w人 · 🕐 48小时 · 📦 300+项目</div>
            <div class="card-meta"><span class="meta-tag">💻 全栈</span><span class="meta-tag">🤝 长期合作</span></div>
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
