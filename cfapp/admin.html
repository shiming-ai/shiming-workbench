<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0420">
<title>商业服务后台 · Crazy Friday</title>
<link rel="stylesheet" href="style.css">
<style>
.chart-card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:16px; margin:0 18px 12px; }
.chart-title { font-size:13px; font-weight:800; margin-bottom:10px; }
.bar-row { display:flex; align-items:flex-end; gap:10px; height:100px; padding-top:10px; }
.bar { flex:1; border-radius:6px 6px 0 0; position:relative; }
.bar-label { position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); font-size:9px; color:#6d6489; }
.tab-row { display:flex; padding:0 18px; margin-bottom:14px; border-bottom:1px solid rgba(255,255,255,.06); }
.tab-btn { flex:1; text-align:center; padding:12px 0; font-size:12px; font-weight:700; color:#8d82a8; cursor:pointer; }
.tab-btn.active { color:#C084FC; border-bottom:2px solid #A855F7; }
</style>
</head>
<body data-tab="me">

<div class="topbar">
    <div class="brand">
        <div class="brand-icon">CF</div>
        <div>
            <div class="brand-name">商业服务后台</div>
            <div class="brand-sub">11 · 生意管理</div>
        </div>
    </div>
    <div class="bell">⚙️</div>
</div>

<div class="wrap">
    <div class="orders-stats" style="padding-top:16px">
        <div class="orders-stat"><div class="num">523</div><div class="lbl">客户总数</div></div>
        <div class="orders-stat"><div class="num">23</div><div class="lbl">项目进行中</div></div>
        <div class="orders-stat"><div class="num">¥128K</div><div class="lbl">本月收入</div></div>
    </div>

    <div class="chart-card">
        <div class="chart-title">📈 收入趋势（近7天）</div>
        <div class="bar-row">
            <div class="bar" style="height:30%;background:rgba(168,85,247,.3)"><span class="bar-label">周一</span></div>
            <div class="bar" style="height:45%;background:rgba(168,85,247,.4)"><span class="bar-label">周二</span></div>
            <div class="bar" style="height:38%;background:rgba(168,85,247,.35)"><span class="bar-label">周三</span></div>
            <div class="bar" style="height:60%;background:rgba(168,85,247,.5)"><span class="bar-label">周四</span></div>
            <div class="bar" style="height:52%;background:rgba(168,85,247,.45)"><span class="bar-label">周五</span></div>
            <div class="bar" style="height:78%;background:linear-gradient(180deg,#A855F7,#EC4899)"><span class="bar-label">周六</span></div>
            <div class="bar" style="height:65%;background:rgba(236,72,153,.4)"><span class="bar-label">周日</span></div>
        </div>
    </div>

    <div class="tab-row">
        <div class="tab-btn active">客户管理</div>
        <div class="tab-btn">项目管理</div>
        <div class="tab-btn">财务管理</div>
        <div class="tab-btn">数据分析</div>
    </div>

    <div class="section" style="padding-top:0">
        <div class="card">
            <div class="card-head">
                <div class="card-icon" style="background:linear-gradient(135deg,#A855F7,#EC4899)">👤</div>
                <div style="flex:1"><div class="card-name">张先生 · 电商老板</div><div style="font-size:10px;color:#6d6489;margin-top:2px">跟进中 · 3天前联系</div></div>
                <span class="card-tag">¥8,000</span>
            </div>
            <div class="card-meta"><span class="meta-tag">📱 微信</span><span class="meta-tag">🎯 意向:AI工作台</span></div>
        </div>
        <div class="card">
            <div class="card-head">
                <div class="card-icon" style="background:linear-gradient(135deg,#10b981,#34D399)">👤</div>
                <div style="flex:1"><div class="card-name">李总 · 餐饮连锁</div><div style="font-size:10px;color:#6d6489;margin-top:2px">已成交 · 已交付</div></div>
                <span class="card-tag">¥20,000</span>
            </div>
            <div class="card-meta"><span class="meta-tag">🤝 长期客户</span><span class="meta-tag">✅ 满意</span></div>
        </div>
        <div class="card">
            <div class="card-head">
                <div class="card-icon" style="background:linear-gradient(135deg,#3b82f6,#22d3ee)">👤</div>
                <div style="flex:1"><div class="card-name">王总 · 培训机构</div><div style="font-size:10px;color:#6d6489;margin-top:2px">已成交 · 复购</div></div>
                <span class="card-tag">¥15,000</span>
            </div>
            <div class="card-meta"><span class="meta-tag">⭐ 复购</span><span class="meta-tag">📅 周结</span></div>
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
