    if (!arr.length) {
        list.innerHTML = `<div class="empty-state"><div class="em">🔍</div>没有找到匹配的工具<br><span style="font-size:11px">换个关键词试试，或看「📖 变现玩法库」</span></div>`;
        return;
    }
    list.innerHTML = arr.map(t => {
        const faved = favs.includes(t.id);
        const tags = (t.tags||[]).map(g => `<span class="tool-tag ${g==='HOT'?'tag-hot':g==='开源'?'tag-gh':g==='国产'?'tag-cn':g==='免费'?'tag-free':'tag-new'}">${g}</span>`).join('');
        return `<div class="tool-item" style="--tc:${t.color}">
            <div class="tool-head">
                <div class="tool-ico" style="background:${t.color}22;color:${t.color}">${t.ico}</div>
                <div style="flex:1">
                    <div class="tool-name">${t.name}</div>
                    <div class="tool-tags">${tags}</div>
                </div>
                <div class="tool-score">⭐ ${t.score}</div>
            </div>
            <div class="tool-use">${t.use}</div>
            <div class="tool-money">💰 <b>变现玩法</b>：${t.money}</div>
            <div class="tool-actions">
                <div class="tool-btn ${faved?'faved':''}" onclick="toggleFav('${t.id}')">${faved?'★ 已收藏':'☆ 收藏'}</div>
                <a class="tool-btn go" href="${t.url}" target="_blank" rel="noopener">🚀 去使用</a>
            </div>
        </div>`;
    }).join('');
}
function toggleFav(id){
    const favs = getFavs();
    if (favs.includes(id)) setFavs(favs.filter(x=>x!==id));
    else { setFavs([...favs, id]); toast('✅ 已收藏'); }
    renderTools();
}
function showFavOnly(v){
    favOnly = v;
    document.getElementById('favAll').classList.toggle('active', !v);
    document.getElementById('favOnly').classList.toggle('active', v);
    renderTools();
}
document.getElementById('searchInput').addEventListener('input', e => { searchKw = e.target.value; renderTools(); });

renderCats();
renderTools();
</script>
</body>
