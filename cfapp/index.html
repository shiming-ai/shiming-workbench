<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0420">
<title>疯狂星期五 · 社区</title>
<link rel="stylesheet" href="style.css">
<style>
/* 帖子流 */
.feed { padding: 0 18px; }
.feed-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 16px; margin-bottom: 12px;
    cursor: pointer;
}
.feed-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.feed-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,#7C3AED,#A855F7,#EC4899); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.feed-author { font-size: 13px; font-weight: 800; }
.feed-time { font-size: 10px; color: #6d6489; margin-top: 1px; }
.feed-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; line-height: 1.4; }
.feed-text {
    font-size: 12.5px; color: #a89ec9; line-height: 1.7;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    margin-bottom: 10px;
}
.feed-tags { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.feed-tag { padding: 3px 10px; border-radius: 12px; background: rgba(168,85,247,0.12); color: #C084FC; font-size: 10px; font-weight: 600; }
.feed-actions { display: flex; align-items: center; gap: 4px; }
.feed-action { display: flex; align-items: center; gap: 5px; padding: 6px 10px; font-size: 12px; color: #8d82a8; }
.feed-action .ai { font-size: 15px; }
.feed-action.liked { color: #EC4899; }
.feed-action.faved { color: #FFD700; }
.feed-action span.count { font-size: 10px; }
</style>
</head>
<body data-tab="home">

<!-- 顶部 -->
<div class="topbar">
    <div class="brand">
        <div class="brand-icon">CF</div>
        <div>
            <div class="brand-name">Crazy Friday</div>
            <div class="brand-sub">疯狂星期五 · 社区</div>
        </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
        <div class="bell" style="font-size:15px;cursor:pointer" onclick="location.href='publish.html'">✏️</div>
        <div class="bell" style="font-size:15px;cursor:pointer" onclick="location.href='post.html'" title="疯狂星期五">🦄</div>
    </div>
</div>

<div class="wrap">
    <div class="section-head" style="padding-top:8px">
        <div class="section-tt">🔥 推荐</div>
        <div class="section-more" onclick="location.href='discover.html'">发现更多 ›</div>
    </div>
    <div class="feed" id="feed"></div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
<script src="data.js"></script>
<script>
function renderFeed() {
    const d = loadCommunity();
    const feed = document.getElementById('feed');
    if (d.posts.length === 0) {
        feed.innerHTML = '<div class="empty" style="margin:0 18px"><div class="em">📭</div>还没有帖子<br>点右上角 ✏️ 发布第一篇</div>';
        return;
    }
    feed.innerHTML = d.posts.map(p => `
        <div class="feed-card" onclick="location.href='post.html?id=${p.id}'">
            <div class="feed-head">
                <div class="feed-avatar">${p.avatar}</div>
                <div style="flex:1">
                    <div class="feed-author">${p.author}</div>
                    <div class="feed-time">${p.time}</div>
                </div>
            </div>
            <div class="feed-title">${p.title}</div>
            <div class="feed-text">${p.content.replace(/\n/g,'<br>')}</div>
            <div class="feed-tags">${p.tags.map(t => '<span class="feed-tag">'+t+'</span>').join('')}</div>
            <div class="feed-actions" onclick="event.stopPropagation()">
                <div class="feed-action ${p.liked?'liked':''}" onclick="likePost('${p.id}',this)">
                    <span class="ai">${p.liked?'❤️':'🤍'}</span><span class="count">${fmtCount(p.like)}</span>
                </div>
                <div class="feed-action ${p.faved?'faved':''}" onclick="favPost('${p.id}',this)">
                    <span class="ai">${p.faved?'⭐':'☆'}</span><span class="count">${fmtCount(p.fav)}</span>
                </div>
                <div class="feed-action" onclick="location.href='post.html?id=${p.id}'">
                    <span class="ai">💬</span><span class="count">${p.comment}</span>
                </div>
                <div class="feed-action" style="margin-left:auto;color:#6d6489">
                    <span class="ai">👁️</span><span class="count">${fmtCount(p.views)}</span>
                </div>
            </div>
        </div>
    `).join('');
}

function likePost(id, el) {
    const p = toggleLikePost(id);
    el.classList.toggle('liked', p.liked);
    el.innerHTML = '<span class="ai">'+(p.liked?'❤️':'🤍')+'</span><span class="count">'+fmtCount(p.like)+'</span>';
    toast(p.liked ? '❤️ 已点赞' : '已取消点赞');
}
function favPost(id, el) {
    const p = toggleFavPost(id);
    el.classList.toggle('faved', p.faved);
    el.innerHTML = '<span class="ai">'+(p.faved?'⭐':'☆')+'</span><span class="count">'+fmtCount(p.fav)+'</span>';
    toast(p.faved ? '⭐ 已收藏' : '已取消收藏');
}

renderFeed();
</script>
</body>
</html>
