<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0420">
<title>AI创业路线图 · Crazy Friday</title>
<link rel="stylesheet" href="style.css">
<style>
.roadmap-node { display:flex; gap:14px; padding:14px 18px; position:relative; }
.roadmap-node::before { content:''; position:absolute; left:35px; top:48px; bottom:-10px; width:2px; background:linear-gradient(180deg,rgba(168,85,247,.5),rgba(236,72,153,.2)); }
.roadmap-node:last-child::before { display:none; }
.node-circle { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#A855F7,#EC4899); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; box-shadow:0 4px 16px rgba(168,85,247,.3); }
.node-body { flex:1; padding-top:2px; }
.node-title { font-size:14px; font-weight:800; }
.node-desc { font-size:11px; color:#8d82a8; margin-top:3px; line-height:1.7; }
.node-status { display:inline-block; margin-top:6px; padding:3px 10px; border-radius:10px; font-size:9px; font-weight:700; }
</style>
</head>
<body data-tab="discover">

<div class="topbar">
    <div class="brand">
        <div class="brand-icon">CF</div>
        <div>
            <div class="brand-name">AI创业路线图</div>
            <div class="brand-sub">14 · 从0到1</div>
        </div>
    </div>
    <div class="bell">🔍</div>
</div>

<div class="wrap">
    <div class="hero" style="padding:24px 20px 10px">
        <div style="font-size:19px;font-weight:900;text-align:center">AI创业<span style="color:#C084FC">全流程路线</span></div>
        <div style="font-size:11px;color:#8d82a8;text-align:center;margin-top:4px">从发现机会到扩大客源，一步步走</div>
    </div>

    <div class="section" style="padding-top:10px">
        <div class="roadmap-node">
            <div class="node-circle">💡</div>
            <div class="node-body">
                <div class="node-title">发现机会</div>
                <div class="node-desc">观察市场 · 发现痛点 · 找到你的AI切入点</div>
                <span class="node-status" style="background:rgba(52,211,153,.15);color:#34D399">当前阶段</span>
            </div>
        </div>
        <div class="roadmap-node">
            <div class="node-circle">📚</div>
            <div class="node-body">
                <div class="node-title">学习方法</div>
                <div class="node-desc">学习AI工具 · 掌握变现技能 · 进入AI营</div>
            </div>
        </div>
        <div class="roadmap-node">
            <div class="node-circle">🔍</div>
            <div class="node-body">
                <div class="node-title">调研市场</div>
                <div class="node-desc">验证需求 · 分析竞品 · 确认客群</div>
            </div>
        </div>
        <div class="roadmap-node">
            <div class="node-circle">🛠️</div>
            <div class="node-body">
                <div class="node-title">小步MVP</div>
                <div class="node-desc">用最小成本做出产品 · 快速试错迭代</div>
            </div>
        </div>
        <div class="roadmap-node">
            <div class="node-circle">💰</div>
            <div class="node-body">
                <div class="node-title">变现客户</div>
                <div class="node-desc">找到付费客户 · 建立收入模型 · 扩大客源</div>
            </div>
        </div>
    </div>

    <div class="section-head" style="padding-top:8px">
        <div class="section-tt">📊 你的进度</div>
    </div>
    <div class="section" style="padding-top:0">
        <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-bottom:10px">
            <div style="font-size:12px;color:#8d82a8;margin-bottom:8px">整体进度</div>
            <div style="height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden">
                <div style="height:100%;width:20%;background:linear-gradient(90deg,#A855F7,#EC4899);border-radius:4px"></div>
            </div>
            <div style="font-size:10px;color:#6d6489;margin-top:6px">已完成 1/5 · 继续加油</div>
        </div>
    </div>

    <a class="cta" style="background:linear-gradient(135deg,#A855F7,#EC4899);color:#fff;text-align:center;padding:14px;border-radius:20px;display:block;margin:20px 18px;font-weight:800">🚀 开启你的创业之旅</a>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
