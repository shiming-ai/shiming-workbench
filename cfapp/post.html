<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0420">
<title>帖子详情</title>
<link rel="stylesheet" href="style.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#0d0420; color:#f5f3ff; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; min-height:100vh; overflow-x:hidden; padding-bottom:90px; }
.nav { position:sticky; top:0; z-index:90; background:rgba(13,4,32,.9); backdrop-filter:blur(20px); border-bottom:1px solid rgba(255,255,255,.06); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
.nav-left { display:flex; align-items:center; gap:14px; }
.nav-back { font-size:18px; color:#a89ec9; cursor:pointer; padding:4px; }
.nav-title { font-size:13px; font-weight:700; color:#a89ec9; }
.nav-ico { font-size:18px; color:#a89ec9; cursor:pointer; }

.author { display:flex; align-items:center; gap:12px; padding:16px 20px; }
.avatar { width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg,#7C3AED,#A855F7,#EC4899); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.avatar-name { font-size:15px; font-weight:800; }
.avatar-desc { font-size:11px; color:#6d6489; margin-top:3px; }
.follow-btn { margin-left:auto; padding:7px 18px; background:linear-gradient(135deg,#A855F7,#EC4899); border-radius:20px; font-size:12px; font-weight:700; cursor:pointer; flex-shrink:0; }
.follow-btn.done { background:rgba(255,255,255,.08); color:#a89ec9; }

.title-area { padding:6px 20px 4px; }
.post-title { font-size:24px; font-weight:900; line-height:1.3; }
.post-time { font-size:11px; color:#6d6489; margin-top:6px; }
.post-tags { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.post-tag { padding:4px 12px; border-radius:16px; background:rgba(168,85,247,.12); color:#C084FC; font-size:11px; font-weight:600; }

.content { padding:16px 20px; }
.content-card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:20px; line-height:2; font-size:14px; color:#d6cfe8; white-space:pre-wrap; }

.post-stats { display:flex; gap:20px; padding:4px 20px 16px; font-size:11px; color:#6d6489; }

.action-bar { position:fixed; bottom:0; left:0; right:0; z-index:100; background:rgba(13,4,32,.92); backdrop-filter:blur(20px); border-top:1px solid rgba(255,255,255,.08); padding:10px 20px; display:flex; align-items:center; gap:6px; max-width:480px; margin:0 auto; }
.action-input { flex:1; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:9px 14px; font-size:12px; color:#8d82a8; }
.action-item { display:flex; align-items:center; gap:4px; padding:8px 10px; font-size:12px; color:#a89ec9; cursor:pointer; flex-shrink:0; }
.action-item .ai { font-size:17px; }
.action-item.liked { color:#EC4899; }
.action-item.faved { color:#FFD700; }
.action-item .count { font-size:10px; }

.comments { padding:0 20px; }
.comments-head { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; margin-bottom:12px; }
.comment-item { display:flex; gap:10px; padding:12px 0; border-top:1px solid rgba(255,255,255,.05); }
.comment-avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#22d3ee); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.comment-body { flex:1; }
.comment-name { font-size:12px; font-weight:700; color:#a89ec9; }
.comment-text { font-size:13px; margin-top:3px; line-height:1.6; }
.comment-time { font-size:10px; color:#6d6489; margin-top:4px; }
.comment-like { font-size:12px; color:#8d82a8; cursor:pointer; flex-shrink:0; }

.comment-input-row { display:flex; gap:8px; padding:12px 0; }
.comment-input { flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:10px 14px; color:#fff; font-size:13px; outline:none; }
.comment-send { padding:10px 18px; background:linear-gradient(135deg,#A855F7,#EC4899); border:none; border-radius:16px; color:#fff; font-size:13px; font-weight:700; cursor:pointer; }

#toast { position:fixed; bottom:100px; left:50%; z-index:200; transform:translateX(-50%) translateY(20px); background:linear-gradient(135deg,#A855F7,#EC4899); color:#fff; padding:10px 20px; border-radius:24px; font-size:13px; font-weight:700; opacity:0; transition:all .3s; pointer-events:none; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="nav">
    <div class="nav-left">
        <span class="nav-back" onclick="history.back()">‹</span>
        <span class="nav-title">帖子详情</span>
    </div>
    <div class="nav-right">
        <span class="nav-ico" onclick="sharePost()">📤</span>
    </div>
</div>

<div id="postArea"></div>
<div id="commentArea" style="display:none">
    <div class="comments">
        <div class="comments-head">💬 评论 <span id="commentCount" style="color:#8d82a8;font-weight:400"></span></div>
        <div id="commentList"></div>
        <div class="comment-input-row">
            <input class="comment-input" id="commentInput" placeholder="写下你的评论...">
            <button class="comment-send" onclick="sendComment()">发送</button>
        </div>
    </div>
</div>

<div class="action-bar">
    <div class="action-input" onclick="document.getElementById('commentInput').focus()">✍️ 发表评论...</div>
    <div class="action-item" id="likeBtn" onclick="likePost()"><span class="ai">🤍</span><span class="count" id="likeCount">0</span></div>
    <div class="action-item" id="favBtn" onclick="favPost()"><span class="ai">☆</span></div>
    <div class="action-item" onclick="sharePost()"><span class="ai">↗</span></div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
<script src="data.js"></script>
<script>
let currentPostId = null;

function getPostId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id') || 'p1';
}

function renderPost() {
    const id = getPostId();
    const p = getPost(id);
    if (!p) { document.getElementById('postArea').innerHTML = '<div class="empty" style="margin:40px 20px">帖子不存在</div>'; return; }
    currentPostId = id;
    const d = loadCommunity();
    document.getElementById('postArea').innerHTML = `
        <div class="author">
            <div class="avatar">${p.avatar}</div>
            <div style="flex:1">
                <div class="avatar-name">${p.author}</div>
                <div class="avatar-desc">${p.authorDesc}</div>
            </div>
            <div class="follow-btn ${d.following?'done':''}" onclick="toggleFollow(this)">${d.following?'✓ 已关注':'+ 关注'}</div>
        </div>
        <div class="title-area">
            <div class="post-title">${p.title}</div>
            <div class="post-time">${p.time} · 👁️ ${fmtCount(p.views)} 浏览</div>
            <div class="post-tags">${p.tags.map(t => '<span class="post-tag">'+t+'</span>').join('')}</div>
        </div>
        <div class="content">
            <div class="content-card">${p.content}</div>
        </div>
        <div class="post-stats">
            <span>❤️ ${fmtCount(p.like)}</span>
            <span>⭐ ${fmtCount(p.fav)}</span>
            <span>💬 ${p.comment}</span>
        </div>`;
    // 互动条状态
    document.getElementById('likeBtn').className = 'action-item' + (p.liked?' liked':'');
    document.getElementById('likeBtn').innerHTML = '<span class="ai">'+(p.liked?'❤️':'🤍')+'</span><span class="count" id="likeCount">'+fmtCount(p.like)+'</span>';
    document.getElementById('favBtn').className = 'action-item' + (p.faved?' faved':'');
    document.getElementById('favBtn').innerHTML = '<span class="ai">'+(p.faved?'⭐':'☆')+'</span>';
    // 评论区
    renderComments();
}

function renderComments() {
    const id = currentPostId;
    const p = getPost(id);
    const comments = getComments(id);
    document.getElementById('commentArea').style.display = 'block';
    document.getElementById('commentCount').textContent = p ? p.comment : 0;
    if (comments.length === 0) {
        document.getElementById('commentList').innerHTML = '<div style="text-align:center;padding:20px;color:#6d6489;font-size:12px">还没有评论，来抢沙发</div>';
        return;
    }
    document.getElementById('commentList').innerHTML = comments.map((c,i) => `
        <div class="comment-item">
            <div class="comment-avatar">${c.avatar}</div>
            <div class="comment-body">
                <div class="comment-name">${c.name}</div>
                <div class="comment-text">${c.text}</div>
                <div class="comment-time">${c.time}</div>
            </div>
            <div class="comment-like">♡ ${c.like}</div>
        </div>
    `).join('');
}

function likePost() {
    if (!currentPostId) return;
    const p = toggleLikePost(currentPostId);
    document.getElementById('likeBtn').className = 'action-item' + (p.liked?' liked':'');
    document.getElementById('likeBtn').innerHTML = '<span class="ai">'+(p.liked?'❤️':'🤍')+'</span><span class="count" id="likeCount">'+fmtCount(p.like)+'</span>';
    document.querySelector('.post-stats').innerHTML = '<span>❤️ '+fmtCount(p.like)+'</span><span>⭐ '+fmtCount(p.fav)+'</span><span>💬 '+p.comment+'</span>';
    toast(p.liked ? '❤️ 已点赞' : '已取消点赞');
}
function favPost() {
    if (!currentPostId) return;
    const p = toggleFavPost(currentPostId);
    document.getElementById('favBtn').className = 'action-item' + (p.faved?' faved':'');
    document.getElementById('favBtn').innerHTML = '<span class="ai">'+(p.faved?'⭐':'☆')+'</span>';
    document.querySelector('.post-stats').innerHTML = '<span>❤️ '+fmtCount(p.like)+'</span><span>⭐ '+fmtCount(p.fav)+'</span><span>💬 '+p.comment+'</span>';
    toast(p.faved ? '⭐ 已收藏' : '已取消收藏');
}
function toggleFollow(el) {
    const following = toggleFollow();
    el.classList.toggle('done', following);
    el.textContent = following ? '✓ 已关注' : '+ 关注';
    toast(following ? '已关注' : '已取消关注');
}
function sendComment() {
    const input = document.getElementById('commentInput');
    const text = input.value.trim();
    if (!text) return toast('请输入评论内容');
    addComment(currentPostId, text);
    input.value = '';
    renderComments();
    toast('✅ 评论成功');
}
function sharePost() {
    const p = getPost(currentPostId);
    const code = (p ? p.title : '疯狂星期五') + '\nhttps://shiming-ai.github.io/shiming-workbench/cfapp/post.html?id=' + (currentPostId||'p1');
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(code).then(()=>toast('✅ 已复制'));
    } else {
        const ta = document.createElement('textarea'); ta.value = code; ta.style.position='fixed'; ta.style.left='-9999px';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast('✅ 已复制'); } catch(e) {}
        document.body.removeChild(ta);
    }
}

renderPost();
</script>
</body>
</html>
