<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0420">
<title>消息 · Crazy Friday</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-tab="messages">

<div class="topbar">
    <div class="brand">
        <div class="brand-icon">CF</div>
        <div>
            <div class="brand-name">消息</div>
            <div class="brand-sub">Crazy Friday</div>
        </div>
    </div>
    <div class="bell">⚙️</div>
</div>

<div class="wrap">
    <div class="hero" style="padding-bottom:20px">
        <div class="hero-title" style="font-size:30px">💬 消息</div>
    </div>

    <div class="section">
        <div class="card">
            <div class="card-head">
                <div class="card-icon" style="background:linear-gradient(135deg,#a855f7,#ec4899)">📋</div>
                <div class="card-name">接单工坊 · 系统</div>
                <div class="card-tag">5分钟前</div>
            </div>
            <div class="card-desc">您的登记已成功加入接单工坊人才库 · 5个客户已查看</div>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="card-icon" style="background:linear-gradient(135deg,#10b981,#34D399)">🤝</div>
                <div class="card-name">老王工作室</div>
                <div class="card-tag">2小时前</div>
            </div>
            <div class="card-desc">您好，看到您登记接单，想沟通一个AI工作台定制项目...</div>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="card-icon" style="background:linear-gradient(135deg,#3b82f6,#06b6d4)">🎨</div>
                <div class="card-name">Crazy Friday · 学院</div>
                <div class="card-tag">昨天</div>
            </div>
            <div class="card-desc">您预约的《AI创业实战营》即将开课</div>
        </div>

        <div class="empty">
            <div class="em">💬</div>
            暂无更多消息
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
