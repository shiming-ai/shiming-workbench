<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0420">
<title>数据中心 · Crazy Friday</title>
<link rel="stylesheet" href="style.css">
<style>
.chart-card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:16px; margin:0 18px 12px; }
.chart-title { font-size:13px; font-weight:800; margin-bottom:10px; }
.pie-wrap { display:flex; align-items:center; gap:20px; padding:10px 0; }
.pie { width:90px; height:90px; border-radius:50%; flex-shrink:0; position:relative; }
.pie-center { position:absolute; inset:20%; border-radius:50%; background:#0d0420; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }
.legend { flex:1; }
.legend-item { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:11px; color:#a89ec9; }
.legend-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.legend-val { margin-left:auto; color:#fff; font-weight:700; }
.bar-row { display:flex; align-items:flex-end; gap:10px; height:90px; padding-top:10px; }
.bar { flex:1; border-radius:6px 6px 0 0; position:relative; }
.bar-label { position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); font-size:9px; color:#6d6489; }
</style>
</head>
<body data-tab="me">

<div class="topbar">
    <div class="brand">
        <div class="brand-icon">CF</div>
        <div>
            <div class="brand-name">数据中心</div>
            <div class="brand-sub">12 · 数据洞察</div>
        </div>
    </div>
    <div class="bell">⚙️</div>
</div>

<div class="wrap">
    <div class="orders-stats" style="padding-top:16px">
        <div class="orders-stat"><div class="num">2,856</div><div class="lbl">用户增长</div></div>
        <div class="orders-stat"><div class="num">1,523</div><div class="lbl">活跃用户</div></div>
        <div class="orders-stat"><div class="num">23.6%</div><div class="lbl">转化率</div></div>
    </div>
    <div style="padding:0 18px;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:8px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2);border-radius:12px;padding:10px 14px;font-size:12px;color:#34D399">
            <span style="font-size:16px">📈</span> 较上周 +18.2% 增长
        </div>
    </div>

    <div class="chart-card">
        <div class="chart-title">💰 收入趋势</div>
        <div class="bar-row">
            <div class="bar" style="height:30%;background:rgba(168,85,247,.3)"><span class="bar-label">1月</span></div>
            <div class="bar" style="height:42%;background:rgba(168,85,247,.38)"><span class="bar-label">2月</span></div>
            <div class="bar" style="height:50%;background:rgba(168,85,247,.45)"><span class="bar-label">3月</span></div>
            <div class="bar" style="height:58%;background:rgba(168,85,247,.5)"><span class="bar-label">4月</span></div>
            <div class="bar" style="height:72%;background:linear-gradient(180deg,#A855F7,#EC4899)"><span class="bar-label">5月</span></div>
            <div class="bar" style="height:90%;background:linear-gradient(180deg,#EC4899,#F43F5E)"><span class="bar-label">6月</span></div>
        </div>
    </div>

    <div class="chart-card">
        <div class="chart-title">👥 用户分布</div>
        <div class="pie-wrap">
            <div class="pie" style="background:conic-gradient(#A855F7 0 45%, #EC4899 45% 65%, #34D399 65% 80%, #FFD93D 80% 90%, #60A5FA 90% 100%)">
                <div class="pie-center">100%</div>
            </div>
            <div class="legend">
                <div class="legend-item"><span class="legend-dot" style="background:#A855F7"></span>新用户<span class="legend-val">45%</span></div>
                <div class="legend-item"><span class="legend-dot" style="background:#EC4899"></span>活跃用户<span class="legend-val">20%</span></div>
                <div class="legend-item"><span class="legend-dot" style="background:#34D399"></span>忠实用户<span class="legend-val">15%</span></div>
                <div class="legend-item"><span class="legend-dot" style="background:#FFD93D"></span>VIP用户<span class="legend-val">10%</span></div>
                <div class="legend-item"><span class="legend-dot" style="background:#60A5FA"></span>其他<span class="legend-val">10%</span></div>
            </div>
        </div>
    </div>

    <div class="chart-card">
        <div class="chart-title">📣 来源渠道</div>
        <div class="bar-row">
            <div class="bar" style="height:80%;background:linear-gradient(180deg,#A855F7,#EC4899)"><span class="bar-label">抖音</span></div>
            <div class="bar" style="height:62%;background:rgba(168,85,247,.5)"><span class="bar-label">小红书</span></div>
            <div class="bar" style="height:45%;background:rgba(168,85,247,.38)"><span class="bar-label">微信</span></div>
            <div class="bar" style="height:35%;background:rgba(168,85,247,.3)"><span class="bar-label">B站</span></div>
            <div class="bar" style="height:28%;background:rgba(168,85,247,.25)"><span class="bar-label">其他</span></div>
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
