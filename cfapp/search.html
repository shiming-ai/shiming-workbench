<style>
.sx-hero{padding:20px 18px 10px;text-align:center}
.sx-hero h2{font-size:22px;font-weight:900}
.sx-hero p{font-size:11px;color:#a89ec9;margin-top:6px}
.sx-search{padding:16px 18px 12px}
.sx-box{background:rgba(255,255,255,.06);border:1px solid rgba(168,85,247,.4);border-radius:18px;padding:13px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(168,85,247,.15)}
.sx-box input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px}
.sx-box input::placeholder{color:#6d6489}
.sx-hot{padding:0 18px 10px}
.sx-hot-tag{display:inline-block;font-size:10px;padding:4px 12px;border-radius:14px;background:rgba(255,255,255,.05);color:#8d82a8;cursor:pointer;margin:0 4px 6px 0;font-weight:700}
.sx-hot-tag:active{background:rgba(168,85,247,.2);color:#C084FC}
.sx-count{padding:0 18px 8px;font-size:11px;color:#6d6489}
.sx-group{padding:0 18px 8px;font-size:13px;font-weight:900;display:flex;align-items:center;gap:6px}
.sx-group .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#A855F7,#EC4899)}
.sx-results{padding:0 18px 20px}
.sx-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:13px;margin-bottom:8px;cursor:pointer;text-decoration:none;color:inherit}
.sx-item:active{transform:scale(.97)}
.sx-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sx-name{font-size:13px;font-weight:800;flex:1}
.sx-desc{font-size:10px;color:#6d6489;margin-top:2px}
.sx-go{font-size:10px;color:#C084FC;font-weight:800}
.sx-empty{text-align:center;padding:50px 20px;color:#6d6489}
.sx-empty .em{font-size:44px;margin-bottom:12px}

const HOT = ['变现','接单','电商','视频','Agent','AI工作台','小红书','自动化'];
const GROUP_COLOR = { 'AI工具':'#A855F7','变现玩法':'#34D399','课程':'#8B5CF6','成品工作台':'#FF6B1A','模板市集':'#EC4899','OPC项目':'#60A5FA','应用':'#22D3EE','服务商':'#F59E0B','板块':'#FFD700' };

function renderHot(){
  document.getElementById('hotTags').innerHTML = HOT.map(t=>`<span class="sx-hot-tag" onclick="search('${t}')">${t}</span>`).join('');
}
function search(kw){
  const input = document.getElementById('sxInput');
  input.value = kw;
  doSearch();
}
function doSearch(){
  const kw = document.getElementById('sxInput').value.trim().toLowerCase();
  const results = document.getElementById('sxResults');
  const count = document.getElementById('sxCount');
  if (!kw) {
    count.textContent = '';
    results.innerHTML = '<div class="sx-empty"><div class="em">✨</div>输入关键词开始搜索<br><span style="font-size:11px">试试：变现 / 接单 / 电商 / 视频 / Agent</span></div>';
    return;
  }
  const hits = IDX.filter(x => (x.n+x.d+x.g).toLowerCase().includes(kw));
  count.textContent = `找到 ${hits.length} 个结果`;
  if (!hits.length) {
    results.innerHTML = `<div class="sx-empty"><div class="em">🔍</div>没找到「${kw}」<br><span style="font-size:11px">换个关键词试试</span></div>`;
    return;
  }
  // 按分组
  const groups = {};
  hits.forEach(h => { if (!groups[h.g]) groups[h.g] = []; groups[h.g].push(h); });
  results.innerHTML = Object.entries(groups).map(([g, items]) => `
    <div class="sx-group"><span class="dot"></span>${g} · ${items.length}</div>
    ${items.map(h => `<a class="sx-item" href="${h.u}">
      <div class="sx-ico" style="background:${h.c}22;color:${h.c}">${h.i}</div>
      <div style="flex:1"><div class="sx-name">${h.n}</div><div class="sx-desc">${h.d}</div></div>
      <div class="sx-go">→</div>
    </a>`).join('')}
  `).join('');
}
document.getElementById('sxInput').addEventListener('input', doSearch);
document.getElementById('sxInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
renderHot();
