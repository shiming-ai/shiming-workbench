<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0420">
<title>AI营 · Crazy Friday</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-tab="discover">

<div class="topbar">
    <div class="brand">
        <div class="brand-icon">CF</div>
        <div>
            <div class="brand-name">AI营</div>
            <div class="brand-sub">04 · 学院</div>
        </div>
    </div>
    <div class="bell">🔍</div>
</div>

<div class="wrap">
    <div class="hero" style="padding:24px 18px 12px">
        <div style="font-size:18px;font-weight:900;margin-bottom:6px">系统学习<span style="color:#C084FC">AI知识</span> · 实战提升能力</div>
    </div>

    <div style="padding:0 18px 14px">
        <div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:8px">
            <span style="color:#8d82a8">🔍</span>
            <input placeholder="搜索课程、行业、关键词..." style="flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:13px">
        </div>
    </div>

    <div class="orders-stats">
        <div class="orders-stat"><div class="num">3,000+</div><div class="lbl">系统课程</div></div>
        <div class="orders-stat"><div class="num">500+</div><div class="lbl">实战案例</div></div>
        <div class="orders-stat"><div class="num">3,000+</div><div class="lbl">学完掌握</div></div>
    </div>

    <div class="section-head" style="padding-top:8px">
        <div class="section-tt">🎓 今日推荐课程</div>
        <div class="section-more">查看更多</div>
    </div>
    <div class="section">
        <div class="card" style="background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(236,72,153,.05));border:1px solid rgba(168,85,247,.25)">
            <div class="card-head">
                <div class="card-icon" style="background:linear-gradient(135deg,#A855F7,#EC4899);font-size:22px">🎯</div>
                <div class="card-name" style="font-size:15px">AI创业实战营</div>
                <span class="card-tag" style="background:rgba(255,215,0,.15);color:#FFD700">推荐</span>
            </div>
            <div class="card-desc">从0到1，打造AI一人公司<br>100+系统课程 · 500+实战案例 · 3000+学完掌握</div>
            <a class="cta" style="background:linear-gradient(135deg,#A855F7,#EC4899);color:#fff;text-align:center;padding:11px;border-radius:18px;display:block;margin-top:10px;font-weight:800">开始学习</a>
        </div>
    </div>

    <div class="section-head" style="padding-top:24px">
        <div class="section-tt">🔥 热门课程 TOP 10</div>
        <div class="section-more">查看更多</div>
    </div>
    <div class="section">
        <div class="card" style="border-left:3px solid #FFD700"><div class="card-head"><div class="card-icon">🥇</div><div class="card-name">1. AI提示词工程实战</div><div style="font-size:11px;color:#8d82a8;margin-top:2px">学习 1.2w人 · ⭐ 4.9</div></div></div>
        <div class="card" style="border-left:3px solid #C0C0C0"><div class="card-head"><div class="card-icon">🥈</div><div class="card-name">2. AI数字人带货</div><div style="font-size:11px;color:#8d82a8;margin-top:2px">学习 8.7k人 · ⭐ 4.8</div></div></div>
        <div class="card" style="border-left:3px solid #CD7F32"><div class="card-head"><div class="card-icon">🥉</div><div class="card-name">3. AI Agent智能体搭建</div><div style="font-size:11px;color:#8d82a8;margin-top:2px">学习 3.2w人 · ⭐ 4.8</div></div></div>
        <div class="card"><div class="card-head"><div class="card-icon">4</div><div class="card-name">AI数字人简历</div><div style="font-size:11px;color:#8d82a8;margin-top:2px">⭐ 4.7</div></div></div>
        <div class="card"><div class="card-head"><div class="card-icon">5</div><div class="card-name">AI脚本编写</div><div style="font-size:11px;color:#8d82a8;margin-top:2px">⭐ 4.6</div></div></div>
    </div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
