<title>行业案例 · Crazy Friday</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
    --bg:#0d0420; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07); --border:rgba(255,255,255,.09);
    --text:#f5f3ff; --dim:#a89ec9; --mute:#6d6489;
    --purple:#A855F7; --purple-deep:#7C3AED; --purple-light:#C084FC; --pink:#EC4899;
    --gold:#FFD700; --green:#34D399; --cyan:#22D3EE; --blue:#60A5FA; --red:#F87171;
}
body { background:var(--bg); color:var(--text); min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; background-image:radial-gradient(ellipse 700px 420px at 50% -6%, rgba(168,85,247,.2), transparent 60%); background-attachment:fixed; }
.wrap { max-width:820px; margin:0 auto; padding:14px 16px 60px; }
/* 顶栏 */
.topbar { display:flex; align-items:center; gap:10px; padding:12px 2px; }
.topbar .back { width:40px; height:40px; border-radius:12px; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.topbar .tb-r { margin-left:auto; display:flex; gap:8px; }
.tb-btn { font-size:11px; font-weight:800; color:#fff; background:linear-gradient(135deg,var(--purple),var(--pink)); padding:10px 16px; border-radius:18px; text-decoration:none; cursor:pointer; border:none; }
.tb-btn.ghost { background:rgba(255,255,255,.06); border:1px solid var(--border); }
/* Hero */
.hero { text-align:center; padding:18px 0 6px; position:relative; }
.hero .badge { display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:800; color:var(--purple-light); background:rgba(168,85,247,.12); border:1px solid rgba(168,85,247,.3); padding:6px 14px; border-radius:18px; margin-bottom:14px; }
.hero h1 { font-size:clamp(24px,4.5vw,36px); font-weight:900; letter-spacing:-1px; line-height:1.2; }
.hero .tagline { font-size:13px; color:var(--dim); margin:10px auto 0; max-width:560px; line-height:1.8; }
.hero .tagline b { color:#fff; }
/* 成果 KPI */
.kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; }
.kpi { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 8px; text-align:center; }
.kpi .n { font-size:clamp(20px,3vw,28px); font-weight:900; background:linear-gradient(135deg,#fff,#C084FC); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1.1; }
.kpi .l { font-size:10.5px; color:var(--dim); margin-top:5px; font-weight:700; }
.kpi .d { font-size:8.5px; color:var(--mute); margin-top:2px; }
/* 区块 */
.sec { margin-top:26px; }
.sec-hd { display:flex; align-items:center; gap:9px; margin-bottom:12px; }
.sec-hd .bar { width:4px; height:18px; border-radius:2px; background:linear-gradient(180deg,var(--purple),var(--pink)); }
.sec-hd h2 { font-size:16px; font-weight:900; }
.sec-hd .tag { font-size:9px; color:var(--mute); }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; }
/* 故事 */
.story { font-size:12.5px; color:var(--dim); line-height:2; }
.story b { color:#fff; }
.story .hl { color:var(--purple-light); font-weight:800; }
.story .pains { margin-top:10px; }
.story .pain { display:flex; align-items:flex-start; gap:8px; font-size:11.5px; color:#e2d9f5; background:rgba(248,113,113,.07); border:1px solid rgba(248,113,113,.18); border-radius:10px; padding:9px 12px; margin-bottom:7px; }
.story .pain .x { color:var(--red); font-weight:900; flex-shrink:0; }
/* 功能点 */
.feat-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.feat { display:flex; gap:9px; align-items:flex-start; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:11px 12px; }
.feat .fi { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; }
.feat .fn { font-size:11.5px; font-weight:800; color:#fff; }
.feat .fd { font-size:9.5px; color:var(--dim); margin-top:2px; line-height:1.5; }
/* 图表 */
.chart-card { padding:14px; }
.chart-title { font-size:11px; font-weight:800; color:var(--dim); margin-bottom:10px; }
.bars { display:flex; align-items:flex-end; gap:6px; height:130px; padding:0 4px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
.bar-col .bv { font-size:9px; color:var(--dim); font-weight:700; }
.bar-col .bb { width:100%; border-radius:6px 6px 2px 2px; background:linear-gradient(180deg,var(--purple),var(--purple-deep)); position:relative; min-height:6px; transition:height .6s ease; }
.bar-col .bl { font-size:8.5px; color:var(--mute); }
/* 证言 */
.tst { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:9px; }
.tst .q { font-size:12px; color:#e2d9f5; line-height:1.9; }
.tst .q::before { content:'“'; color:var(--purple); font-size:22px; font-weight:900; margin-right:2px; }
.tst .q::after { content:'”'; color:var(--purple); font-size:22px; font-weight:900; margin-left:2px; }
.tst .who { display:flex; align-items:center; gap:9px; margin-top:9px; }
.tst .av { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:#fff; }
.tst .nm { font-size:11px; font-weight:800; color:#fff; }
.tst .rl { font-size:9px; color:var(--mute); }
.tst .stars { margin-left:auto; color:var(--gold); font-size:11px; }
/* 价格 */
.plans { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.plan { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 12px; text-align:center; position:relative; }
.plan.pop { border-color:rgba(168,85,247,.55); background:rgba(168,85,247,.1); }
.plan .pt { font-size:10px; font-weight:900; color:var(--purple-light); }
.plan .pn { font-size:14px; font-weight:900; margin:4px 0; }
.plan .pp { font-size:20px; font-weight:900; color:var(--gold); }
.plan .pp small { font-size:9px; color:var(--mute); font-weight:600; }
.plan .pd { font-size:9px; color:var(--dim); line-height:1.6; margin-top:6px; }
.plan .pbtn { display:block; margin-top:10px; padding:9px 0; border-radius:14px; font-size:11px; font-weight:900; color:#fff; background:linear-gradient(135deg,var(--purple),var(--pink)); cursor:pointer; text-decoration:none; border:none; width:100%; }
.plan .pbtn.gold { background:linear-gradient(135deg,#FFD700,#F59E0B); color:#1a0d2e; }
/* CTA */
.cta { margin-top:24px; background:linear-gradient(160deg,rgba(168,85,247,.14),rgba(236,72,153,.05)); border:1px solid rgba(168,85,247,.32); border-radius:18px; padding:22px 18px; text-align:center; }
.cta h3 { font-size:18px; font-weight:900; margin-bottom:7px; }
.cta p { font-size:11.5px; color:var(--dim); line-height:1.8; margin-bottom:14px; }
.cta .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.cta .btn { display:inline-flex; align-items:center; gap:7px; padding:13px 24px; border-radius:22px; font-size:13px; font-weight:900; text-decoration:none; cursor:pointer; border:none; color:#fff; }
.cta .btn-main { background:linear-gradient(135deg,var(--purple),var(--pink)); box-shadow:0 8px 24px rgba(168,85,247,.4); }
.cta .btn-ghost { background:rgba(255,255,255,.06); border:1px solid var(--border); }
.demo-note { text-align:center; font-size:9.5px; color:var(--mute); margin-top:12px; line-height:1.7; }
.foot { text-align:center; padding:18px 0 10px; font-size:9.5px; color:var(--mute); }
@media (max-width:560px){ .feat-grid { grid-template-columns:1fr; } .plans { grid-template-columns:1fr; } .plan { max-width:320px; margin:0 auto; width:100%; } }
</style>
</head>

        <div class="stars">★★★★★</div></div></div>`).join('')}
</div>

<div class="sec">
    <div class="sec-hd"><span class="bar"></span><h2>价格方案</h2></div>
    <div class="plans">${c.plans.map(p=>`
        <div class="plan ${p.pop?'pop':''}">
            <div class="pt">${p.t}</div><div class="pn">${p.n}</div>
            <div class="pp">${p.p}<small>${p.unit||''}</small></div><div class="pd">${p.d}</div>
            <button class="pbtn ${p.gold?'gold':''}" onclick="buy('${id}','${esc(p.n)}','${p.p.replace(/[^0-9]/g,'')}')">${p.b}</button>
        </div>`).join('')}</div>
</div>

<div class="cta">
    <h3>想要 <span style="color:${c.color}">${c.name}</span> 同款？</h3>
    <p>买现成的，或定制专属于你的版本——<br>交付源码、改品牌即可上线，次日交付。</p>
    <div class="btns">
        <a class="btn btn-main" href="cfapp/store.html">🛒 去商店买现成的</a>
        <a class="btn btn-ghost" href="landing.html">🛠️ 定制我的专属版</a>
    </div>
    <div class="demo-note">* 本页客户故事/数据为演示内容，用于展示产品价值 · Crazy Friday</div>
</div>

<div class="foot">Crazy Friday · 案例详情 · 回到<a href="demo-gallery.html" style="color:var(--purple-light)">案例广场</a></div>`;

function buy(id, name, price){
    location.href = 'cfapp/pay.html?sku=case_'+id+'&name='+encodeURIComponent(name)+'&price='+(price||299);
}
</script>
</body>
</html>
