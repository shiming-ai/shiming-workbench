}
function defaultChart(c){

      vals: Array.from({length:12},(_,i)=>Math.round(3.5+ i*0.65 + Math.sin(i)*0.4)) };

}
function defaultPlans(c){
    const base = c.price || 299;
    return [{t:'轻量版',n:'基础版',p:'¥'+Math.round(base*0.6),d:'核心功能',b:'立即购买'},{t:'推荐',n:'标准版',p:'¥'+base,d:'全套功能',b:'立即购买',pop:true,gold:true},{t:'定制',n:'专属定制',p:'¥'+Math.round(base*3)+'起',d:'按需求定制',b:'定制同款'}];
}

if (!c.plans) c.plans = defaultPlans(c);

const maxV = Math.max(...c.chart.vals);
const bars = c.chart.vals.map((v,i)=>`
    <div class="bar-col"><div class="bv">${v}</div>
    <div class="bb" style="height:${Math.max(6,(v/maxV)*100)}%;background:linear-gradient(180deg,${c.color},${c.color}55)"></div>
    <div class="bl">${c.chart.labels[i]}</div></div>`).join('');

/* 更多案例 */

const moreHtml = moreList.map(k=>{ const x=CASES[k]; return `<a class="mc" href="demo-case.html?id=${k}"><div class="mi">${x.ico}</div><div class="mn">${x.name.replace('工作台','').replace('管理台','')}</div><div class="md">${x.industry.split(' · ')[0]}</div></a>`; }).join('');
