<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="hl" cx="50%" cy="20%">
      <stop offset="0%" stop-color="rgba(255,255,255,.35)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="bear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F5E6D3"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景（iOS 自动裁圆角，保留安全区） -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#hl)"/>
  <!-- 小熊身体（圆形） -->
  <ellipse cx="256" cy="360" rx="120" ry="100" fill="url(#bear)"/>
  <!-- 头 -->
  <circle cx="256" cy="240" r="115" fill="url(#bear)"/>
  <!-- 耳朵 -->
  <circle cx="170" cy="155" r="35" fill="url(#bear)"/>
  <circle cx="342" cy="155" r="35" fill="url(#bear)"/>
  <circle cx="170" cy="155" r="20" fill="#F9D5C5"/>
  <circle cx="342" cy="155" r="20" fill="#F9D5C5"/>
  <!-- 眼睛（蓝绿发光） -->
  <circle cx="216" cy="240" r="13" fill="#1F2937"/>
  <circle cx="296" cy="240" r="13" fill="#1F2937"/>
  <circle cx="220" cy="236" r="5" fill="#fff"/>
  <circle cx="300" cy="236" r="5" fill="#fff"/>
  <!-- 鼻子 -->
  <ellipse cx="256" cy="275" rx="9" ry="6" fill="#1F2937"/>
  <!-- 微笑 -->
  <path d="M240 295 Q256 310 272 295" stroke="#1F2937" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- 紫色小围巾（品牌标识） -->
  <path d="M180 330 Q256 365 332 330 L322 365 Q256 395 190 365 Z" fill="#A855F7"/>
  <!-- 围巾上小爱心 -->
  <path d="M256 360 c-3 -5 -10 -5 -10 1 c0 4 10 10 10 10 c0 0 10 -6 10 -10 c0 -6 -7 -6 -10 -1 z" fill="#F9A8D4"/>
  <!-- 腮红 -->
  <circle cx="195" cy="265" r="10" fill="#F9A8D4" opacity=".6"/>
  <circle cx="317" cy="265" r="10" fill="#F9A8D4" opacity=".6"/>
</svg>
